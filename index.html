<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>たすひくチャレンジ</title>
<style>
  :root{
    --bg:#fff8ec; --card:#ffffff; --ink:#3b3a36; --sub:#8a8578;
    --blue:#3d8bfd; --green:#2bb673; --red:#ef5350; --yellow:#ffc53d; --line:#efe6d4;
    --l1:#ff8a65; --l2:#ffa726; --l3:#66bb6a; --l4:#26c6da; --l5:#7986cb; --l6:#ab47bc;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;}
  body{user-select:none;-webkit-user-select:none}
  .screen{display:none;min-height:100vh;padding:16px;max-width:820px;margin:0 auto}
  .screen.active{display:flex;flex-direction:column}
  h1{text-align:center;font-size:clamp(28px,6vw,44px);margin:10px 0 4px;letter-spacing:.08em}
  h1 span{color:var(--blue)} h1 b{color:var(--red)}
  .lead{text-align:center;color:var(--sub);margin:0 0 14px;font-size:16px}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  svg{display:block}

  /* ホーム */
  .advbtn{display:flex;align-items:center;gap:14px;width:100%;color:#fff;text-align:left;
    background:linear-gradient(135deg,#4f8ef7,#8a5cf0);border-radius:22px;padding:12px 18px;
    box-shadow:0 5px 0 #4b45b8;margin:6px 0 18px;transition:transform .08s}
  .advbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #4b45b8}
  .advbtn .ab-art{width:56px;height:66px;flex:none;background:rgba(255,255,255,.2);border-radius:16px;padding:6px 8px}
  .advbtn .ab-t{font-size:24px;font-weight:bold;letter-spacing:.05em}
  .advbtn .ab-s{font-size:15px;opacity:.9;margin-top:2px}
  .advbtn .ab-go{margin-left:auto;font-size:28px}
  .sec{font-size:18px;margin:0 0 10px;color:var(--sub);text-align:center}
  .count-select{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
  .count-select button{padding:10px 22px;border-radius:999px;font-size:18px;background:#fff;
    border:3px solid var(--line);color:var(--sub);font-weight:bold}
  .count-select button.on{border-color:var(--blue);color:var(--blue);background:#eaf2ff}
  .levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .lv{background:var(--card);border-radius:18px;padding:14px 16px;text-align:left;
    box-shadow:0 4px 0 var(--line);border-left:12px solid var(--c);transition:transform .08s}
  .lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .lv .no{font-size:15px;color:var(--c);font-weight:bold}
  .lv .nm{font-size:21px;font-weight:bold;margin:2px 0;word-break:keep-all;overflow-wrap:anywhere}
  .lv .ex{font-size:15px;color:var(--sub)}
  .lv .best{margin-top:8px;font-size:15px;background:#faf6ee;border-radius:10px;padding:6px 10px}
  .lv .best .star{color:var(--yellow)}
  .foot{margin-top:auto;padding-top:18px;text-align:center}
  .foot button{background:none;color:var(--sub);font-size:13px;text-decoration:underline;margin:0 8px}

  /* モード えらび */
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 0 14px}
  .mode{position:relative;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 4px 8px;
    text-align:center;color:var(--sub);box-shadow:0 4px 0 var(--line)}
  .mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .mode .st{display:inline-block;font-size:13px;font-weight:bold;border-radius:999px;padding:1px 10px;background:#f4efe6}
  .mode .mt{display:block;font-size:19px;font-weight:bold;margin-top:4px;color:var(--ink);white-space:nowrap}
  .mode .ms{display:block;font-size:13px;margin-top:2px}
  .mode.on{border-color:var(--m);background:color-mix(in srgb,var(--m) 9%,#fff);box-shadow:0 4px 0 var(--m)}
  .mode.on .st{background:var(--m);color:#fff}
  .mode.on .mt{color:var(--m)}
  .mode:not(:last-child)::after{content:"▶";position:absolute;right:-11px;top:50%;transform:translateY(-50%);
    font-size:11px;color:#d6cbb5;z-index:1}
  .mpanel{display:none} .mpanel.on{display:block}
  .mlead{text-align:center;color:var(--sub);font-size:15px;margin:0 0 12px;word-break:keep-all;overflow-wrap:anywhere}
  .lv .best.soro{background:#fff3e6;color:#9a5a1e}
  /* なんいど */
  .diffsel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 4px}
  .diffsel button{background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 4px 7px;color:var(--sub);
    box-shadow:0 3px 0 var(--line)}
  .diffsel button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
  .diffsel b{display:block;font-size:19px;color:var(--ink);white-space:nowrap}
  .diffsel small{display:block;font-size:12px;margin-top:2px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
  .diffsel .on{border-color:var(--d);background:color-mix(in srgb,var(--d) 10%,#fff);box-shadow:0 3px 0 var(--d)}
  .diffsel .on b{color:var(--d)}
  .diffsel .clr{color:var(--yellow);margin-left:2px}
  .diffsel .lock{background:#f1ece2;border-style:dashed}
  .diffsel .lock b{color:#b5ad9c}
  .diffnote{text-align:center;font-size:14px;color:var(--red);font-weight:bold;min-height:1.5em;margin:2px 0 0}
  .dtag{display:inline-block;color:#fff;background:var(--d);border-radius:999px;padding:1px 10px;font-size:14px;
    vertical-align:middle;margin-left:8px;letter-spacing:0;position:relative;top:-2px}
  .ovc .red{color:var(--red);font-weight:bold}
  /* ほし・アイテム */
  .path{padding-bottom:22px}
  .nst{position:absolute;top:calc(100% + 2px);left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:13px;letter-spacing:-1px;line-height:1;color:#e2d9c6}
  .nst .on{color:#f2b600;text-shadow:0 1px 0 #b07d00}
  .ico{display:inline-block;width:1.5em;height:1.5em;vertical-align:-.45em}
  .ico svg{width:100%;height:100%}
  .bagline{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:#fff;border-radius:999px;
    padding:4px 14px;margin:0 auto 10px;font-size:16px;font-weight:bold;box-shadow:0 3px 0 var(--line)}
  .bagline .bl{color:var(--sub);font-size:14px}
  @media (max-width:420px){ .bagline .inm{display:none} .bagline{gap:10px} }
  .stlist{display:inline-block;text-align:left;margin-top:10px;font-size:15px;line-height:1.75;background:#fffaf0;border-radius:12px;padding:6px 12px}
  .stlist .s{color:#e2d9c6;font-size:18px} .stlist .s.on{color:#f2b600}
  @media (max-width:420px){ .stlist{font-size:13px;padding:6px 8px} }
  .rstars{font-size:46px;letter-spacing:6px;line-height:1.1;color:#e2d9c6}
  .rstars .on{color:#f2b600;text-shadow:0 2px 0 #b07d00}
  .rstars .new{display:inline-block;animation:pop .7s}
  .rstars small{display:block;font-size:13px;letter-spacing:0;color:var(--sub)}
  .getitems{margin-top:10px}
  .getitems .ttl{font-size:20px;font-weight:bold;color:#2b8a57;margin-bottom:6px}
  .getitems .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,150px));justify-content:center;gap:8px}
  .icard{background:#f0faf4;border-radius:14px;padding:8px 6px;animation:pop .6s;word-break:keep-all;overflow-wrap:anywhere}
  .icard .ico{width:46px;height:46px;display:block;margin:0 auto 2px}
  .icard b{display:block;font-size:17px} .icard small{display:block;font-size:12px;color:var(--sub)}
  .items{position:absolute;right:2px;top:2px;display:flex;flex-direction:column;gap:4px;z-index:2}
  .itm{position:relative;width:34px;height:34px;border-radius:10px;background:#232a5a;border:2px solid #3b4384;padding:3px}
  .itm svg{width:100%;height:100%}
  .itm b{position:absolute;right:-7px;bottom:-6px;background:#f5c542;color:#12152e;font-size:11px;border-radius:999px;
    min-width:17px;padding:0 3px;line-height:17px}
  .itm:disabled{opacity:.35}
  .itm.on{border-color:#f5c542;box-shadow:0 0 10px #f5c542;opacity:1}
  .itm.on b{background:#2bb673;color:#fff}
  @media (max-width:600px){ .itm{width:30px;height:30px;padding:2px} .items{gap:3px} }
  .itm.auto{display:block;cursor:default;margin-top:8px}
  /* やくそう ボタン（ひだり した に おおきく） */
  .herbbtn{position:absolute;left:4px;bottom:4px;z-index:2;width:64px;padding:4px 2px 3px;border-radius:14px;
    background:linear-gradient(#2f9e63,#1f7a4a);border:3px solid #8fe0a6;color:#fff;box-shadow:0 3px 0 #0f4a2b;
    display:flex;flex-direction:column;align-items:center;line-height:1.1}
  .herbbtn svg{width:34px;height:34px}
  .herbbtn .hl{font-size:12px;font-weight:bold;letter-spacing:0;white-space:nowrap}
  .herbbtn b{position:absolute;right:-8px;top:-8px;background:#f5c542;color:#12152e;font-size:14px;border-radius:999px;
    min-width:22px;padding:0 4px;line-height:22px;border:2px solid #12152e}
  .herbbtn.ready{animation:herbPulse 1.1s ease-in-out infinite}
  @keyframes herbPulse{0%,100%{box-shadow:0 3px 0 #0f4a2b,0 0 0 0 rgba(143,224,166,.7)}50%{box-shadow:0 3px 0 #0f4a2b,0 0 0 8px rgba(143,224,166,0);transform:scale(1.06)}}
  .herbbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #0f4a2b}
  .herbbtn:disabled{opacity:.4;filter:grayscale(.5)}
  .herbbtn:disabled b{background:#9aa0c0}
  @media (max-width:600px){ .herbbtn{width:56px;left:2px;bottom:2px} .herbbtn svg{width:28px;height:28px} .herbbtn .hl{font-size:11px} }
  /* やくそうの エフェクト */
  .heal{position:absolute;inset:-60px -14px -10px;pointer-events:none;z-index:4;overflow:hidden;border-radius:18px}
  .heal.show{animation:healBg 1.4s ease-out forwards}
  @keyframes healBg{0%{background:rgba(120,255,170,0)}15%{background:rgba(120,255,170,.35)}100%{background:rgba(120,255,170,0)}}
  .heal .pt{position:absolute;bottom:-10px;color:#b9ffd0;font-weight:bold;text-shadow:0 0 6px #2bb673,0 0 12px #2bb673;opacity:0}
  .heal.show .pt{animation:healUp 1.3s ease-out forwards}
  @keyframes healUp{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-150px) scale(1.1)}}
  .heal .plus{position:absolute;right:92px;top:4px;font-size:22px;font-weight:bold;color:#fff;white-space:nowrap;opacity:0;
    text-shadow:0 0 6px #2bb673,0 0 12px #2bb673,0 2px 0 #1f7a4a}
  .heal.show .plus{animation:healPlus 1.4s ease-out forwards}
  @keyframes healPlus{0%{opacity:0;transform:translateY(16px) scale(.6)}25%{opacity:1;transform:translateY(0) scale(1.2)}70%{opacity:1;transform:translateY(-6px) scale(1)}100%{opacity:0;transform:translateY(-16px)}}
  #play.bossmode .hearts .healed{display:inline-block;animation:healHeart 1s ease-out}
  @keyframes healHeart{0%{transform:scale(.3);color:#8fe0a6;text-shadow:0 0 14px #8fe0a6}50%{transform:scale(1.6);color:#8fe0a6;text-shadow:0 0 18px #8fe0a6}100%{transform:scale(1)}}
  .itm.auto.has{border-color:#5aa0ff;box-shadow:0 0 8px rgba(90,160,255,.8)}
  .itm.auto i{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-style:normal;font-size:9px;font-weight:bold;
    background:#5aa0ff;color:#fff;border-radius:999px;padding:0 4px;line-height:13px;white-space:nowrap}
  .itm.auto.pop{animation:pop .5s}
  /* たてで ふせぐ えんしゅつ */
  .guard{position:absolute;left:50%;bottom:-4px;width:96px;height:96px;margin-left:-48px;z-index:3;pointer-events:none;opacity:0}
  .guard svg{width:100%;height:100%;filter:drop-shadow(0 0 10px #8ec5ff)}
  .guard .spark{position:absolute;left:50%;top:-6px;transform:translateX(-50%) scale(0);font-size:24px;font-weight:bold;color:#fff;
    white-space:nowrap;text-shadow:0 0 6px #5aa0ff,0 0 12px #5aa0ff,0 2px 0 #1e5bb8}
  .guard .ring{position:absolute;inset:-6px;border-radius:50%;border:4px solid #bfe0ff;opacity:0}
  .guard.show{animation:gIn 1.5s ease-out forwards}
  .guard.show svg{animation:gHit 1.5s ease-out forwards}
  .guard.show .spark{animation:gSpark 1.5s ease-out forwards}
  .guard.show .ring{animation:gRing 1.5s ease-out forwards}
  @keyframes gIn{0%{opacity:0;transform:translateY(40px) scale(.4)}18%{opacity:1;transform:translateY(-6px) scale(1.1)}28%{transform:translateY(0) scale(1)}
    80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(18px) scale(.85)}}
  @keyframes gHit{0%,30%{transform:none}36%{transform:translateY(8px) scale(.94);filter:drop-shadow(0 0 22px #fff) brightness(1.8)}
    46%{transform:translateX(-5px) rotate(-5deg)}56%{transform:translateX(4px) rotate(4deg)}66%{transform:none;filter:drop-shadow(0 0 10px #8ec5ff)}100%{transform:none}}
  @keyframes gSpark{0%,32%{transform:translateX(-50%) scale(0);opacity:0}40%{transform:translateX(-50%) scale(1.25);opacity:1}
    75%{transform:translateX(-50%) translateY(-8px) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-16px);opacity:0}}
  @keyframes gRing{0%,32%{opacity:0;transform:scale(.6)}38%{opacity:1}70%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
  @media (max-width:600px){ .guard{width:80px;height:80px;margin-left:-40px} .guard .spark{font-size:20px} }
  /* ===== ゆうしゃ と こうげきの えんしゅつ ===== */
  .bp-bot{display:flex;gap:8px;align-items:stretch;margin-top:6px}
  .bp-bot .msgwin{flex:1;margin-top:0;min-width:0}
  .bp-bot .herbbtn{position:relative;left:auto;bottom:auto;flex:none;align-self:center}
  #play.bossmode .monster{margin-left:24%}
  #play.bossmode .shadow{left:62%;width:140px;margin-left:-70px}
  #play.bossmode .dmg{left:calc(62% - 44px);top:6px;z-index:4}
  #play.bossmode .warnmsg{left:calc(24% + 4px);top:0}
  #play.bossmode .guard{left:calc(24% + 30px);margin-left:-40px;width:80px;height:80px}
  .bhero{position:absolute;left:calc(24% - 40px);bottom:2px;width:80px;height:93px;z-index:2;animation:heroIdle 1.6s ease-in-out infinite}
  .bhero svg{width:100%;height:100%}
  @keyframes heroIdle{50%{transform:translateY(-2px)}}
  .bhero.enter{animation:heroEnter 1s ease-out}
  @keyframes heroEnter{0%{opacity:0;transform:translateX(-90px)}15%{opacity:1;transform:translateX(-76px) translateY(-5px)}30%{transform:translateX(-60px)}
    45%{transform:translateX(-44px) translateY(-5px)}60%{transform:translateX(-28px)}75%{transform:translateX(-14px) translateY(-5px)}100%{opacity:1;transform:none}}
  .bhero.atk{animation:heroAtk .45s ease-out}
  @keyframes heroAtk{0%{transform:none}35%{transform:translateX(46px) translateY(-5px) rotate(7deg)}100%{transform:none}}
  .bhero.hit{animation:heroHit .55s}
  @keyframes heroHit{0%{transform:none}20%{transform:translateX(-12px) rotate(-9deg);filter:brightness(1.3) drop-shadow(0 0 8px #ff5252)}
    55%{transform:translateX(4px) rotate(3deg);filter:drop-shadow(0 0 6px #ff5252)}100%{transform:none;filter:none}}
  .monster.atk{animation:atkL .5s}
  @keyframes atkL{40%{transform:translateX(-38px) scale(1.15)}100%{transform:none}}
  .slash{position:absolute;left:calc(62% - 62px);top:50%;margin-top:-62px;width:124px;height:124px;z-index:3;pointer-events:none;opacity:0}
  .slash svg{width:100%;height:100%;overflow:visible}
  .slash.show{opacity:1}
  .slash.crit svg{transform:scale(1.35)}
  .slash path.s{stroke-dasharray:100;stroke-dashoffset:100;animation:slashDraw .5s ease-out forwards}
  @keyframes slashDraw{0%{stroke-dashoffset:100;opacity:1}45%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
  .slash .boom{transform-origin:50px 50px;animation:boom .45s ease-out forwards;opacity:0}
  @keyframes boom{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.4)}}
  .slash .sp{animation:boom .6s ease-out forwards;opacity:0}
  #play.bossmode .bosspanel.critfx{animation:critFx .35s}
  @keyframes critFx{0%{filter:brightness(2.2)}100%{filter:none}}
  @media (max-width:600px){
    .bhero{width:68px;height:79px;left:calc(24% - 34px)}
    #play.bossmode .shadow{width:110px;margin-left:-55px}
    #play.bossmode .dmg{left:calc(62% - 40px);font-size:28px} #play.bossmode .dmg.crit{font-size:30px}
    .slash{width:104px;height:104px;margin-top:-52px;left:calc(62% - 52px)} }
  #play.easy #bAtkRow{display:none}
  @media (max-width:420px){ .diffsel b{font-size:16px} .diffsel small{font-size:11px} }
  @media (max-width:420px){ .mode .mt{font-size:16px} .mode .ms{font-size:11px} }

  /* そろばん */
  .soroban{display:none;max-width:calc(600px * var(--slots,13) / 13);width:100%;margin:0 auto 12px;touch-action:none}
  .soroban.haslo{max-width:620px}
  #play.prmode .soroban{display:block}
  .stool{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 6px}
  #sGuide{flex:1;font-size:16px;font-weight:bold;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;line-height:1.35;min-height:2.7em;display:flex;align-items:center}
  @media (max-width:520px){ #sGuide{font-size:15px;min-height:4.05em} }
  #sGuide.ok{color:var(--green)} #sGuide.ng{color:var(--red)}
  .sbody{display:flex;align-items:center;gap:10px}
  .sbody .sframe{flex:1;min-width:0}
  .loose{display:none;grid-template-columns:repeat(3,var(--bd,30px));gap:4px;padding:6px;align-content:center;
    min-height:calc(var(--bd,30px) + 18px);border:3px dashed #e3cda9;border-radius:14px;background:#fffdf7}
  .soroban.haslo .loose{display:grid}
  .stool button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-size:15px;color:var(--sub);font-weight:bold;white-space:nowrap}
  .sframe{background:linear-gradient(#d49b60,#b9783f);border-radius:16px;padding:8px 10px;box-shadow:0 4px 0 #8d5a2b;touch-action:none}
  .rod{position:relative;aspect-ratio:var(--slots,13)/1.12;background:#fffaf0;border-radius:8px}
  .rod+.rod{margin-top:6px}
  .rod::before{content:"";position:absolute;left:1.5%;right:1.5%;top:50%;height:4px;margin-top:-2px;background:#b3ab9e;border-radius:2px}
  .bead{position:absolute;top:5%;height:90%;width:calc(100% / var(--slots,13) - 2px);padding:0;border-radius:50%;
    left:calc(var(--x) * 100% / var(--slots,13) + 1px);transition:left .16s ease-out,opacity .2s;
    background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.8) 0 14%,transparent 42%),var(--bc);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.3)}
  .bead.faded{opacity:.22}
  /* レベル5：10の かたまり */
  .rod.ten{box-shadow:0 0 0 3px #ffd54f,0 0 14px 4px rgba(255,193,7,.55)}
  .rod.ten .bead{--bc:#ffa000}
  .rod.tenflash{animation:tenglow 1.4s ease-out}
  @keyframes tenglow{0%{box-shadow:none}35%{box-shadow:0 0 0 5px #fff59d,0 0 30px 14px rgba(255,193,7,.95)}
    100%{box-shadow:0 0 0 3px #ffd54f,0 0 14px 4px rgba(255,193,7,.55)}}
  .rod.tenflash .bead{animation:tenpop .5s calc(var(--x) * 50ms) both}
  @keyframes tenpop{0%{transform:scale(1)}50%{transform:scale(1.28) translateY(-8%);filter:brightness(1.35)}100%{transform:scale(1)}}
  .bead.c1{--bc:#ef6c4a} .bead.c2{--bc:#ffd54f} .bead.c3{--bc:#5c9cf5}
  .bead.lb{position:relative;left:auto;top:auto;width:var(--bd,30px);height:var(--bd,30px);transition:transform .2s}
  .bead.lb.drag{transition:none;z-index:20;cursor:grabbing}
  .bead.gone{transform:translateX(160%);opacity:0;transition:transform .22s,opacity .22s}
  #play.prmode .time{display:none}
  #play.prmode .hintbtn{display:none!important}
  #play.prmode .qbox{min-height:116px;padding:12px 10px;margin:4px 0 10px}
  #play.prmode .q{font-size:clamp(40px,9vw,68px)}
  #play.prmode .mark .sym{font-size:90px}
  #play.prmode .pad button{padding:10px 0;font-size:30px}
  .mark .cor.retry{color:var(--blue);font-size:22px}

  /* マップ */
  .maphead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .maphead h2{margin:0;font-size:24px;flex:1;text-align:center}
  .back{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:15px;color:var(--sub);white-space:nowrap}
  #goal{position:sticky;top:8px;z-index:5;margin-bottom:10px}
  .goal{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 14px;
    border:4px solid var(--c);box-shadow:0 4px 10px rgba(0,0,0,.08)}
  .goal .gi{width:58px;height:58px;flex:none}
  .goal .gt{flex:1;min-width:0}
  .goal .gt b{display:block;font-size:20px}
  .goal .gt span{font-size:14px;color:var(--sub)}
  .gobtn{background:var(--c);color:#fff;font-size:20px;font-weight:bold;border-radius:16px;padding:12px 18px;
    box-shadow:0 4px 0 rgba(0,0,0,.2);white-space:nowrap}
  .gobtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .mapmsg{text-align:center;min-height:0;margin-bottom:8px}
  .island{background:#fff;border-radius:22px;padding:10px 14px 14px;margin-bottom:14px;
    box-shadow:0 4px 0 var(--line);border-top:10px solid var(--c);
    background-image:radial-gradient(circle at 90% 120%,color-mix(in srgb,var(--c) 14%,transparent) 0 40%,transparent 41%)}
  .island.locked{filter:grayscale(1);opacity:.55}
  .ihead{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:18px}
  .ihead .ist{font-size:15px;color:var(--c)}
  .path{position:relative;display:flex;justify-content:space-between;align-items:center;padding:46px 2px 4px}
  .path::before{content:"";position:absolute;left:28px;right:40px;top:calc(46px + 26px);border-top:6px dashed #e6dcc8}
  .node{position:relative;z-index:1;width:52px;height:52px;border-radius:50%;background:#f4efe6;border:4px solid #e6dcc8;
    font-weight:bold;font-size:20px;color:#b5ad9c;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
  .node:disabled{cursor:default}
  .node.done{background:var(--c);border-color:var(--c);color:#fff}
  .node.cur{border-color:var(--c);background:#fff;color:var(--c);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 25%,transparent)}}
  .node.boss{width:76px;height:76px;border-radius:22px;background:#fff;padding:4px}
  .node.boss svg{width:100%;height:100%}
  .node.boss.done svg{opacity:.5}
  .node.boss.done::after{content:"★";position:absolute;right:-6px;top:-8px;color:var(--yellow);font-size:26px;
    text-shadow:0 1px 0 #b07d00}
  .node.pop{animation:pop .7s}
  .piece{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);width:34px;height:42px;pointer-events:none}
  .piece.hop{animation:hop .8s .2s both}
  @keyframes hop{0%{transform:translate(-50%,-50px);opacity:0}55%{transform:translate(-50%,4px);opacity:1}
    75%{transform:translate(-50%,-8px)}100%{transform:translate(-50%,0)}}
  @media (max-width:600px){
    .maphead h2{font-size:20px;padding-right:0}
    .goal .gt b{font-size:17px}
    .gobtn{font-size:18px;padding:10px 12px}
    #play .dmg{left:0;right:0;top:-2px;text-align:center;font-size:28px} #play .dmg.crit{font-size:30px}
  }
  @media (max-width:380px){ .node{width:44px;height:44px;font-size:17px} .node.boss{width:64px;height:64px}
    .path::before{top:calc(46px + 22px)} }

  /* スタート確認 */
  .ov{position:fixed;inset:0;background:rgba(40,35,30,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .ov.show{display:flex}
  .ovc{background:#fff;border-radius:26px;padding:20px 18px;max-width:420px;width:100%;text-align:center;animation:pop .35s}
  .ovart{width:120px;height:120px;margin:0 auto}
  .ovc h2{margin:6px 0 2px;font-size:26px}
  .ovsub{color:var(--sub);font-size:15px;word-break:keep-all;overflow-wrap:anywhere}
  .ovc p{font-size:18px;line-height:1.6;margin:10px 0 0;word-break:keep-all;overflow-wrap:anywhere}
  .ovc .done{color:var(--green);font-size:14px}

  /* プレイ */
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .bar .tag{color:#fff;border-radius:999px;padding:6px 14px;font-weight:bold;font-size:16px;white-space:nowrap}
  .bar .prog{flex:1;height:14px;background:#fff;border-radius:999px;overflow:hidden;border:2px solid var(--line)}
  .bar .prog i{display:block;height:100%;width:0;transition:width .2s}
  .bar .num,.bar .time{font-size:18px;font-weight:bold;min-width:56px;text-align:right}
  .bar .quit{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px;color:var(--sub)}
  .qbox{position:relative;background:var(--card);border-radius:24px;box-shadow:0 4px 0 var(--line);
    padding:22px 10px;margin:6px 0 12px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center}
  .q{font-size:clamp(44px,11vw,84px);font-weight:bold;letter-spacing:.04em;white-space:nowrap}
  .q .wd{font-size:.55em;color:var(--sub);margin:0 .15em}
  .ans{display:inline-block;min-width:1.6em;padding:0 .15em;border-bottom:6px solid var(--blue);color:var(--blue);
    background:#eaf2ff;border-radius:10px 10px 0 0;line-height:1.2}
  .ans.empty{color:transparent}
  .frame{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
  .frame .row{display:flex;gap:6px}
  .frame .dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--blue)}
  .frame .dot.f{background:var(--blue)}
  .hintbtn{position:absolute;top:10px;right:12px;background:#fff6dc;border:2px solid var(--yellow);
    color:#b07d00;border-radius:12px;padding:4px 10px;font-size:14px;font-weight:bold}
  .mark{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:24px;pointer-events:none;opacity:0;transition:opacity .1s}
  .mark.show{opacity:1}
  .mark .sym{font-size:150px;line-height:1;font-weight:bold}
  .mark.ok{background:rgba(43,182,115,.12)} .mark.ok .sym{color:var(--green)}
  .mark.ng{background:rgba(239,83,80,.10)} .mark.ng .sym{color:var(--red)}
  .mark .cor{font-size:26px;font-weight:bold;color:var(--red);background:#fff;border-radius:12px;padding:2px 14px}
  .shake{animation:sh .35s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:440px;width:100%;margin:0 auto}
  .pad button{font-size:34px;font-weight:bold;padding:14px 0;border-radius:18px;background:#fff;color:var(--ink);
    box-shadow:0 5px 0 var(--line)}
  .pad button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
  .pad .del{font-size:22px;color:var(--sub)}
  .pad .zero{grid-column:span 2}

  /* ボス戦 */
  .bosspanel{display:none;background:linear-gradient(#e8f1ff,#fff);border-radius:22px;padding:10px 14px 6px;
    margin-bottom:6px;box-shadow:0 4px 0 var(--line)}
  #play.bossmode .bosspanel{display:block}
  #play.bossmode .prog,#play.bossmode .num{display:none}
  #play.bossmode .tag{margin-right:auto}
  #play.bossmode .qbox{min-height:118px;padding:10px;margin:4px 0 10px}
  #play.bossmode .q{font-size:clamp(36px,9vw,62px)}
  #play.bossmode .mark .sym{font-size:84px}
  #play.bossmode .frame .dot{width:26px;height:26px}
  #play.bossmode .pad button{padding:10px 0}
  #play.flash{animation:flash .45s}
  @keyframes flash{0%{background:#ffcdd2}100%{background:transparent}}
  .bp-top{display:flex;align-items:center;gap:10px}
  .bp-name{font-weight:bold;font-size:18px;white-space:nowrap}
  .hp{flex:1;height:20px;background:#eee;border-radius:999px;overflow:hidden;border:2px solid #ddd;position:relative}
  .hp i{display:block;height:100%;background:var(--green);transition:width .35s,background .35s}
  .hpn{font-size:13px;font-weight:bold;color:var(--sub);min-width:62px;text-align:right}
  .bp-mid{position:relative;height:124px;display:flex;justify-content:center;align-items:center}
  .monster{width:122px;height:122px;animation:float 2s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  .monster.hit{animation:hit .45s}
  @keyframes hit{0%{filter:brightness(2.5)}30%{transform:translateX(-12px) rotate(-6deg)}60%{transform:translateX(9px) rotate(5deg)}100%{filter:none;transform:none}}
  .monster.atk{animation:atk .5s}
  @keyframes atk{40%{transform:scale(1.35) translateY(16px)}100%{transform:none}}
  .monster.down{animation:down 1s forwards}
  @keyframes down{0%{transform:none;opacity:1;filter:brightness(2)}30%{transform:rotate(-12deg)}100%{transform:translateY(30px) scale(.15) rotate(200deg);opacity:0}}
  .dmg{position:absolute;left:calc(50% + 66px);top:24px;text-align:left;white-space:nowrap;font-size:34px;font-weight:bold;color:#ff7043;
    text-shadow:0 2px 0 #fff,0 0 6px #fff;opacity:0;pointer-events:none}
  .dmg.crit{color:#e53935;font-size:40px}
  .dmg.show{animation:dmg .9s}
  @keyframes dmg{0%{opacity:0;transform:translateY(14px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-26px)}}
  /* こうげき ゲージ */
  .atk{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
  .atk-l{font-size:13px;font-weight:bold;color:var(--sub);white-space:nowrap}
  .atkbar{flex:1;height:12px;background:#eee;border-radius:999px;overflow:hidden;border:2px solid #ddd}
  .atkbar i{display:block;height:100%;width:0;background:#ffb74d;transition:width .1s linear}
  .atk.warn .atkbar i{background:var(--red);animation:blink .35s infinite alternate}
  .atk.warn .atk-l{color:var(--red)}
  @keyframes blink{from{opacity:1}to{opacity:.35}}
  .warnmsg{position:absolute;left:max(2px,calc(50% - 180px));top:10px;font-size:clamp(20px,5.6vw,26px);font-weight:bold;color:var(--red);white-space:nowrap;
    text-shadow:0 2px 0 #fff,0 0 6px #fff;opacity:0;pointer-events:none;transform:rotate(-8deg)}
  .bp-mid.warn .warnmsg{opacity:1;animation:wob .5s infinite alternate}
  @keyframes wob{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(-4deg) scale(1.12)}}
  .bp-mid.warn .monster{animation:charge .25s infinite alternate;filter:drop-shadow(0 0 10px #ff5252)}
  @keyframes charge{from{transform:translateX(-3px) scale(1.04)}to{transform:translateX(3px) scale(1.08)}}
  /* ===== バトル がめん（RPGふう） ===== */
  html.battle,html.battle body{background:#141936}
  html.battle #play .bar .time{color:#c9cff5}
  html.battle #play .bar .quit{background:#232a5a;border-color:#3b4384;color:#c9cff5}
  html.battle #play.flash{animation:flashB .45s}
  @keyframes flashB{0%{background:#7a1e2c}100%{background:transparent}}
  #play.bossmode .bosspanel{color:#fff;border-radius:18px;padding:10px 14px 12px;margin-bottom:8px;
    background:radial-gradient(ellipse 70% 60% at 50% 62%,#34428e 0%,#232b66 45%,#1b2150 75%,#171c44 100%);
    box-shadow:0 4px 0 #0c0f26,inset 0 0 0 2px #2c3470}
  .bp-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .bp-isl{color:#f5c542;font-weight:bold;font-size:17px;letter-spacing:1px;margin-right:auto;white-space:nowrap}
  #play.bossmode .hearts{font-size:22px;letter-spacing:3px;color:#ff5c7a;text-shadow:0 0 6px rgba(255,92,122,.6)}
  #play.bossmode .hearts .lost{color:#3b4380;text-shadow:none}
  #play.bossmode .bp-name{color:#fff}
  #play.bossmode .hp{background:#0f1330;border:2px solid #e8ebff;height:18px}
  #play.bossmode .hpn{color:#c9cff5}
  #play.bossmode .bp-mid{height:116px}
  #play.bossmode .monster{width:104px;height:104px;position:relative;z-index:1}
  .shadow{position:absolute;left:50%;bottom:6px;width:190px;height:20px;margin-left:-95px;border-radius:50%;
    background:#11163a;opacity:.85;animation:shd 2s ease-in-out infinite}
  @keyframes shd{50%{transform:scaleX(.9)}}
  #play.bossmode .atk-l{color:#c9cff5}
  #play.bossmode .atkbar{background:#0f1330;border-color:#3b4384}
  #play.bossmode .atk.warn .atk-l{color:#ff6b6b}
  .msgwin{margin-top:6px;background:#12152e;border:3px solid #f5c542;border-radius:10px;padding:8px 12px;
    min-height:3.1em;font-size:17px;line-height:1.5;color:#fff;font-weight:bold;letter-spacing:.5px;
    font-family:"BIZ UDGothic","Yu Gothic","Hiragino Kaku Gothic ProN","Osaka-Mono",monospace}
  .msgwin .cur{display:inline-block;width:.6em;animation:blink .6s infinite alternate;color:#f5c542}
  .msgwin .red{color:#ff8a8a} .msgwin .gold{color:#f5c542}
  @media (max-width:600px){ .msgwin{font-size:15px;padding:6px 10px} .bp-isl{font-size:15px}
    #play.bossmode .bosspanel{padding:8px 12px 8px}
    #play.bossmode .bp-mid{height:100px} #play.bossmode .monster{width:92px;height:92px} .shadow{width:150px;margin-left:-75px} }
  .hearts{text-align:center;font-size:28px;letter-spacing:6px;color:var(--red);line-height:1.1}
  .hearts .lost{color:#ddd}
  .hearts .just{display:inline-block;animation:pop .5s}

  /* 結果 */
  .res{background:var(--card);border-radius:24px;box-shadow:0 4px 0 var(--line);padding:20px;text-align:center}
  .rart{width:110px;margin:0 auto}
  .rart:empty{display:none}
  .rart.beaten svg{transform:rotate(-12deg);filter:grayscale(.6);opacity:.8}
  .res .big{font-size:clamp(42px,11vw,68px);font-weight:bold;margin:4px 0}
  .res .big small{font-size:.45em;color:var(--sub)}
  .res .tm{font-size:20px;margin-bottom:6px}
  .res .tm .hrt{color:var(--red)}
  .res .msg{font-size:22px;font-weight:bold;margin:6px 0}
  .newrec{display:inline-block;background:var(--yellow);color:#6b4b00;font-weight:bold;border-radius:999px;
    padding:6px 18px;font-size:20px;animation:pop .6s}
  @keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .wrongs{margin-top:14px;text-align:left}
  .wrongs h3{margin:0 0 6px;font-size:17px;color:var(--red)}
  .wrongs ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
  .wrongs li{background:#fff1f0;border-radius:10px;padding:6px 10px;font-size:18px}
  .wrongs li s{color:var(--red)} .wrongs li b{color:var(--green)}
  .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
  .btns button{font-size:19px;font-weight:bold;padding:12px 20px;border-radius:16px;background:#fff;
    border:3px solid var(--line);color:var(--ink)}
  .btns .pri{background:var(--blue);border-color:var(--blue);color:#fff}
  .btns .rev{background:#fff1f0;border-color:var(--red);color:var(--red)}
  .note{font-size:13px;color:var(--sub);margin-top:8px}

  /* バッヂ */
  .hbtns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 auto 14px}
  .eqbtn{display:flex;align-items:center;gap:4px;background:#eef4ff;border:3px solid var(--blue);color:#1e5bb8;
    font-size:18px;font-weight:bold;border-radius:999px;padding:2px 18px 2px 8px}
  .eqbtn .eqi{width:34px;height:38px}
  .bd .bp{font-size:11px;color:#1e5bb8;margin-top:4px;line-height:1.3;background:#eef4ff;border-radius:8px;padding:2px 4px}
  .bd.off .bp{color:#b0a895;background:#f4efe6}
  /* そうび */
  .eqtop{position:sticky;top:0;z-index:3;background:var(--bg);padding-bottom:6px}
  .eqhero{width:150px;height:170px;margin:0 auto;background:radial-gradient(circle at 50% 60%,#fff 0 55%,transparent 56%)}
  .eqhero svg{width:100%;height:100%}
  @media (max-width:420px){ .eqhero{width:112px;height:126px} .badgebtn{font-size:15px!important;padding:8px 12px!important}
    .eqbtn{font-size:15px;padding:2px 12px 2px 6px} .eqbtn .eqi{width:28px;height:32px}
    .maphead h2{font-size:18px!important} .maphead .dtag{font-size:12px;padding:1px 7px;margin-left:4px} }
  .eqs{background:#fff;border-radius:18px;padding:10px 12px;margin-bottom:10px;box-shadow:0 3px 0 var(--line)}
  .eqh{font-weight:bold;font-size:17px;margin-bottom:6px}
  .eqh small{font-weight:normal;color:var(--sub);font-size:13px;margin-left:6px}
  .eqg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .eqp{background:#faf6ee;border:3px solid transparent;border-radius:14px;padding:6px 4px;font-size:12px;font-weight:bold;
    color:var(--ink);line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
  .eqp .pi{width:54px;height:54px;margin:0 auto 2px;display:flex;align-items:center;justify-content:center}
  .eqp .pi svg{width:100%;height:100%}
  .eqp.on{border-color:var(--blue);background:#eaf2ff}
  .eqp.off{color:#b0a895;font-weight:normal;cursor:default}
  .eqp.off .pi{font-size:30px;font-weight:bold;color:#d6cbb5}
  .eqp.none .pi{font-size:22px;color:var(--sub)}
  .getparts{margin-top:8px;font-size:16px;font-weight:bold;color:#1e5bb8}
  .getparts button{margin-left:6px;font-size:15px;font-weight:bold;background:#eef4ff;border:2px solid var(--blue);color:#1e5bb8;border-radius:999px;padding:3px 12px}
  .badgebtn{display:block;margin:0;background:#fff6dc;border:3px solid var(--yellow);color:#8a6200;
    font-size:18px;font-weight:bold;border-radius:999px;padding:8px 22px}
  .bsec{margin:14px 0 6px;font-size:18px;font-weight:bold;color:var(--c,var(--ink))}
  .bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .bgrid.sp{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .bd{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 3px 0 var(--line)}
  .medal{width:70px;height:70px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:19px;color:#fff;background:var(--c);border:7px solid var(--ring);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.15);text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .medal.off{background:#ece6da;border-color:#ddd5c4;color:#bdb4a2;box-shadow:none;text-shadow:none}
  .bd .bn{font-size:14px;font-weight:bold}
  .bd .bc{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.35}
  .bd.off .bn{color:#b0a895}
  .gotb{margin-top:12px}
  .gotb .ttl{font-size:20px;font-weight:bold;color:#b07d00;margin-bottom:6px}
  .gotb .row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
  .gotb .bd{box-shadow:none;background:#fffaf0;animation:pop .6s;min-width:120px}
  .total{text-align:center;color:var(--sub);font-size:15px}
</style>
</head>
<body>

<!-- ===== ホーム ===== -->
<section id="home" class="screen active">
  <h1><span>たす</span><b>ひく</b>チャレンジ</h1>
  <div class="hbtns"><button class="badgebtn" id="badgeBtn"></button><button class="eqbtn" id="eqBtn"><span class="eqi" id="eqBtnArt"></span>そうび</button></div>
  <div class="modes" id="modes">
    <button class="mode" data-m="pr" style="--m:var(--green)"><span class="st">1</span><span class="mt">れんしゅう</span><span class="ms">5もん・そろばん</span></button>
    <button class="mode" data-m="ch" style="--m:var(--blue)"><span class="st">2</span><span class="mt">チャレンジ</span><span class="ms">10・20もん</span></button>
    <button class="mode" data-m="adv" style="--m:#8a5cf0"><span class="st">3</span><span class="mt">ぼうけん</span><span class="ms">マップで すすむ</span></button>
  </div>
  <div class="mpanel" id="mp-pr">
    <p class="mlead">そろばんの たまを うごかしながら、ゆっくり かんがえよう。</p>
    <div class="levels" id="prLevels"></div>

<script>
/* ================= レベル定義 ================= */
const LEVELS = [
  {id:1, name:"5の ごうせい", ex:"れい：2と □で 5", color:"var(--l1)", type:"comp", total:5,
   pool(){ const a=[]; for(let x=0;x<=5;x++) a.push({a:x}); return a; }},
  {id:2, name:"10の ごうせい", ex:"れい：1と □で 10", color:"var(--l2)", type:"comp", total:10,
   pool(){ const a=[]; for(let x=0;x<=10;x++) a.push({a:x}); return a; }},
  {id:3, name:"くりあがりの ない たしざん", ex:"こたえが 10まで　れい：3＋4", color:"var(--l3)", type:"add",
   pool(){ const a=[]; for(let x=1;x<=9;x++) for(let y=1;x+y<=10;y++) a.push({a:x,b:y}); return a; }},
  {id:4, name:"くりさがりの ない ひきざん", ex:"10までの かず　れい：8－3", color:"var(--l4)", type:"sub",
   pool(){ const a=[]; for(let x=2;x<=10;x++) for(let y=1;y<x;y++) a.push({a:x,b:y}); return a; }},
  {id:5, name:"くりあがりの ある たしざん", ex:"れい：8＋5", color:"var(--l5)", type:"add",
   pool(){ const a=[]; for(let x=2;x<=9;x++) for(let y=2;y<=9;y++) if(x+y>=11) a.push({a:x,b:y}); return a; }},
  {id:6, name:"くりさがりの ある ひきざん", ex:"20までの かず　れい：13－7", color:"var(--l6)", type:"sub",
   pool(){ const a=[]; for(let x=11;x<=18;x++) for(let y=2;y<=9;y++) if(x%10<y && x-y<=9) a.push({a:x,b:y}); return a; }},
];
// もんだい q = {a, b, L}
function answerOf(q){ const L=q.L; return L.type==="comp" ? L.total-q.a : L.type==="add" ? q.a+q.b : q.a-q.b; }
function textOf(q,ansHtml){
  const L=q.L;
  if(L.type==="comp") return `${q.a}<span class="wd">と</span>${ansHtml}<span class="wd">で</span>${L.total}`;
  return `${q.a} ${L.type==="add"?"＋":"－"} ${q.b} = ${ansHtml}`;
}
function plainOf(q){
  const L=q.L;
  if(L.type==="comp") return `${q.a}と □で ${L.total}`;
  return `${q.a} ${L.type==="add"?"＋":"－"} ${q.b}`;
}

/* ================= ぼうけんの せってい ================= */
const STAGE_N=20;     // 1ステージの もんだい数
const STAGE_PASS=15;  // クリアに ひつような せいかい数
const STEPS=5;        // 1つの しまの マス数（さいごの 1マスが ボス）
const ISLANDS=[
  {name:"いつつの しま",     boss:"プルリン",     type:"slime", color:"#ff8a65"},
  {name:"とおの はま",       boss:"ハサミドン",   type:"crab",  color:"#ffa726"},
  {name:"たしざんの もり",   boss:"キノコング",   type:"mush",  color:"#66bb6a"},
  {name:"ひきざんの たに",   boss:"コウモリン",   type:"bat",   color:"#26c6da"},
  {name:"くりあがり やま",   boss:"ガンセキング", type:"rock",  color:"#7986cb"},
  {name:"くりさがり じょう", boss:"まおう ゼロス", type:"king",  color:"#ab47bc"},
];
const TOTAL=ISLANDS.length*STEPS;
const idx=(i,s)=>i*STEPS+s;

/* ================= ほぞん（localStorage） ================= */
const KEY="tasuhiku-challenge-v1", BKEY="tasuhiku-badges-v1", AKEY="tasuhiku-adventure-v1", MKEY="tasuhiku-homemode-v1";
function lsGet(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v||d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const loadRec=()=>lsGet(KEY,{}), saveRec=r=>lsSet(KEY,r);
// ぼうけんは なんいどごとに すすみを わけて ほぞん。むかしの データ（{pos}）は ノーマルに うつす
const DIFFS={
  easy:  {name:"イージー", c:"#2bb673", s:"じかんの こうげき なし"},
  normal:{name:"ノーマル", c:"#3d8bfd", s:"ボスの こうげき あり"},
  hard:  {name:"ハード",   c:"#ef5350", s:"ミスしたら まけ"},
};
function loadAll(){
  let a=lsGet(AKEY,null);
  if(!a || !a.d) a={cur:"normal", d:{normal:{pos:(a&&a.pos)||0}}};
  for(const k in DIFFS) a.d[k]=a.d[k]||{pos:0};
  if(!DIFFS[a.cur]) a.cur="normal";
  return a;
}
const hardOpen=a=>!!a.unlock || a.d.normal.pos>=TOTAL;   // ハードは ノーマルを クリアしたら かいほう
function curDiff(){ const a=loadAll(); return (a.cur==="hard" && !hardOpen(a)) ? "normal" : a.cur; }
const loadAdv=(d=curDiff())=>loadAll().d[d];
function saveAdv(v,d=curDiff()){ const a=loadAll(); a.d[d]=v; if(d==="normal" && v.pos>=TOTAL) a.unlock=true; lsSet(AKEY,a); }
function setDiff(d){ const a=loadAll(); a.cur=d; lsSet(AKEY,a); }
const dtag=d=>`<span class="dtag" style="--d:${DIFFS[d].c}">${DIFFS[d].name}</span>`;

/* ---- ステージの ほし と アイテム ----
   ほし（ステージごと、はじめて とった ときに アイテムを 1こ もらえる）
   st[k]：とった ほしの ビット（1:ごうかく 2:ノーミス 4:スピード）／ bag：もちもの */
const ITEMS={
  herb:  {name:"やくそう", desc:"ハートを 1つ かいふく"},
  sword: {name:"つるぎ",   desc:"せいかいの ダメージ ＋3"},
  shield:{name:"たて",     desc:"じかんぎれの こうげきを じどうで 1かい ふせぐ"},
};
const STARS=[
  {name:"ごうかく", item:d=>null,   cond:L=>`${STAGE_PASS}もん いじょう せいかい`},   // ごうかくは すすめるのが ごほうび
  {name:"ノーミス", item:d=>"herb", cond:L=>`${STAGE_N}もん ぜんぶ せいかい`},
  {name:"スピード", item:d=>d==="easy"?"sword":"shield", cond:L=>`ごうかくして 1もん ${SPEED[L.id]}びょう`},
];
// なんいどごとに つかう アイテム（イージーは じかんぎれの こうげきが ないので たての かわりに つるぎ）
const itemsOf=d=>d==="easy" ? ["herb","sword"] : ["herb","shield"];
const SWORD_DMG=3;
const starsOf=(A,k)=>(A.st&&A.st[k])||0;
const bagOf=A=>Object.assign({herb:0,sword:0,shield:0},A.bag||{});
const starStr=m=>[0,1,2].map(b=>`<span class="${m>>b&1?'on':''}">★</span>`).join("");
function itemSVG(t){
  const v={
    herb:`<rect x="12" y="2" width="8" height="5" rx="1.5" fill="#a1887f"/>
      <path d="M11 7h10v4l5 6v9a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3v-9l5-6z" fill="#dff5e8" stroke="#1f8a52" stroke-width="2" stroke-linejoin="round"/>
      <path d="M7.2 18.5h17.6V26a2 2 0 0 1-2 2H9.2a2 2 0 0 1-2-2z" fill="#2bb673"/>
      <path d="M16 13c-4 2.5-4 7 0 9 4-2 4-6.5 0-9z" fill="#8fe0a6" stroke="#1f8a52" stroke-width="1.2"/>`,
    sword:`<path d="M27.5 2.5l2 2-14 14-3.8-1.8L10 13z" transform="translate(-1 1)" fill="#e3eaef" stroke="#78909c" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M8 15l9 9-2.2 2.2-9-9z" fill="#ffc53d" stroke="#b07d00" stroke-width="1.2"/>
      <path d="M10.5 21.5l-6 6" stroke="#8d6e63" stroke-width="4" stroke-linecap="round"/>
      <circle cx="3.6" cy="28.4" r="2.2" fill="#ffc53d"/>`,
    shield:`<path d="M16 2.5l11.5 4v8.5c0 7-5 12-11.5 14.5C9.5 27 4.5 22 4.5 15V6.5z" fill="#3d8bfd" stroke="#1e5bb8" stroke-width="2" stroke-linejoin="round"/>
      <path d="M16 8v16M10 14.5h12" stroke="#ffc53d" stroke-width="3.2" stroke-linecap="round"/>`,
  }[t];
  return `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">${v}</svg>`;
}
const ico=t=>`<span class="ico">${itemSVG(t)}</span>`;
const bagHtml=(b,d)=>itemsOf(d).map(t=>`${ico(t)}×${b[t]}`).join("　");
const loadB=()=>{ const b=lsGet(BKEY,{got:{},total:0}); b.got=b.got||{}; b.total=b.total||0; return b; };
const saveB=b=>lsSet(BKEY,b);
function better(n,o){ return !o || n.c>o.c || (n.c===o.c && n.t<o.t); }

/* ================= イラスト（SVG） ================= */
// eq：{head, body, right, left, back} に パーツの id（しょうりゃく すると いまの そうび）
const INK="#2b2622", OL=`stroke="${INK}" stroke-width=".9" stroke-linejoin="round"`;
const SKIN="#ffd9b8";
function heroSVG(eq){
  const P=eqParts(eq), part=k=>P[k]?partSVG(P[k]):"";
  return `<svg viewBox="-4 -7 48 56" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="20" cy="46.6" rx="13" ry="2.4" fill="rgba(0,0,0,.2)"/>
  ${part("back")}
  <!-- あし・ブーツ -->
  <rect x="14.2" y="36" width="4.4" height="7" fill="#4e5b8a" ${OL}/><rect x="21.4" y="36" width="4.4" height="7" fill="#4e5b8a" ${OL}/>
  <path d="M13.2 41.5 H18.8 V45.6 H11.8 Q11.6 43 13.2 41.5Z" fill="#7a4a2a" ${OL}/>

  <!-- うで -->
  <path d="M12.6 26 Q8.6 29 8.4 34.5" stroke="${INK}" stroke-width="4.6" fill="none" stroke-linecap="round"/>
  <path d="M12.6 26 Q8.6 29 8.4 34.5" stroke="#3d8bfd" stroke-width="2.9" fill="none" stroke-linecap="round"/>
  <path d="M27.4 26 Q31.4 29 31.6 34.5" stroke="${INK}" stroke-width="4.6" fill="none" stroke-linecap="round"/>

  <path d="M12.2 25 Q20 22.4 27.8 25 L29.4 38.2 Q20 40.2 10.6 38.2Z" fill="#3d8bfd" ${OL}/>

  ${part("body")}
  <!-- て -->
  <circle cx="8.4" cy="35" r="2.3" fill="${SKIN}" ${OL}/>
  <circle cx="31.6" cy="35" r="2.3" fill="${SKIN}" ${OL}/>
  <!-- あたま -->
  <path d="M30.6 10 L35.6 8.4 L34 11.6 L36.4 13.6 L31 13Z" fill="#e53935" ${OL}/>
  <circle cx="20" cy="15" r="11" fill="${SKIN}" ${OL}/>
  <path d="M8.6 15.5 Q7.2 6.6 12.2 3.8 L11.2 0.4 L15.6 2.4 L17.2 -1.2 L20.6 1.8 L24.2 -0.8 L25.2 2.6 L29.8 1.4 L28.6 4.6 Q33.2 8.2 31.4 15.5 Q29.6 10.6 25.8 10 L23.6 11.6 L21.6 9.8 Q15.6 9.6 12.4 12.2 Q10.2 13.4 8.6 15.5Z" fill="#5a3b26" ${OL}/>
  <path d="M13 5.2 Q15.6 3.4 18.4 3.6" stroke="#8a5a3a" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M8.9 10.4 Q20 6.6 31.1 10.4 L31.2 12.8 Q20 9.2 8.8 12.8Z" fill="#e53935" ${OL}/>
  <path d="M13.2 13.3 L17.6 14.2" stroke="${INK}" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M26.8 13.3 L22.4 14.2" stroke="${INK}" stroke-width="1.3" stroke-linecap="round"/>
  <ellipse cx="15.8" cy="17" rx="1.7" ry="2.2" fill="${INK}"/><ellipse cx="24.2" cy="17" rx="1.7" ry="2.2" fill="${INK}"/>
  <circle cx="16.4" cy="16.2" r=".7" fill="#fff"/><circle cx="24.8" cy="16.2" r=".7" fill="#fff"/>
  <ellipse cx="12.8" cy="20.2" rx="1.8" ry="1.1" fill="#ff8a80" opacity=".5"/><ellipse cx="27.2" cy="20.2" rx="1.8" ry="1.1" fill="#ff8a80" opacity=".5"/>
  <path d="M17.4 20.4 Q20 22.8 22.6 20.4" stroke="${INK}" stroke-width="1.2" fill="none" stroke-linecap="round"/>

}
// マント（ゆうしゃの うしろ）
function capeSVG(c,mark){
  const mk = mark==="heart" ? (x=>`<path d="M${x} 42.4 l-2.6-2.6 a1.6 1.6 0 0 1 2.6-2 a1.6 1.6 0 0 1 2.6 2z" fill="#fff" ${OL}/>`)
           : mark==="star" ? (x=>`<polygon points="${x},37.2 ${x+.9},39.2 ${x+3},39.4 ${x+1.4},40.8 ${x+1.9},42.9 ${x},41.8 ${x-1.9},42.9 ${x-1.4},40.8 ${x-3},39.4 ${x-.9},39.2" fill="#fff" ${OL}/>`) : (x=>"");

    ${mk(5.6)}${mk(34.4)}

// ===== そうびの え（レベルが あがるほど つよそうに） =====
// t：1 かわ → 2 どう → 3 てつ → 4 はがね → 5 きし → 6 ゆうしゃ → 7 でんせつ
const MAT={
  1:{b:"#b07445",d:"#7d4b28",l:"#dca679"},
  2:{b:"#d58b4c",d:"#9a5726",l:"#f5bf8c"},
  3:{b:"#8e9aa8",d:"#5d6977",l:"#c6cfd9"},
  4:{b:"#bac8d8",d:"#7a8da3",l:"#f0f5fa"},
  5:{b:"#e2e8ef",d:"#98a4b3",l:"#ffffff"},
  6:{b:"#3a5fd0",d:"#233c8f",l:"#7d98f2"},
  7:{b:"#ffc53d",d:"#c98f00",l:"#fff3b0"},
};
const GOLD="#f2c230";
const MIR=(s,cx=20)=>`${s}<g transform="translate(${2*cx} 0) scale(-1 1)">${s}</g>`;   // ひだりみぎ おなじ かたち
const rivet=(x,y,c="#fff")=>`<circle cx="${x}" cy="${y}" r=".6" fill="${c}" stroke="${INK}" stroke-width=".4"/>`;
const gem=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${OL}/><circle cx="${x-r*.35}" cy="${y-r*.35}" r="${r*.32}" fill="#fff" opacity=".85"/>`;
const spark=(x,y,s,c="#fff59d")=>`<path d="M${x} ${y-s} Q${x+s*.18} ${y-s*.18} ${x+s} ${y} Q${x+s*.18} ${y+s*.18} ${x} ${y+s} Q${x-s*.18} ${y+s*.18} ${x-s} ${y} Q${x-s*.18} ${y-s*.18} ${x} ${y-s}Z" fill="${c}"/>`;
const SHD='fill="rgba(0,0,0,.2)"';

function armorSVG(t,c,star){
  const M=MAT[t], tr = t>=5 ? (t===5?GOLD:"#ffe27a") : null;
  let s="";
  if(t===1){   // かわの むねあて
    s+=`<path d="M14.4 25.6 L12.4 24 M25.6 25.6 L27.6 24" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M14.4 25.6 L12.4 24 M25.6 25.6 L27.6 24" stroke="${M.d}" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M14 25.2 Q20 23.6 26 25.2 L25.6 32.4 Q20 34.2 14.4 32.4Z" fill="${M.b}" ${OL}/>
      <path d="M20 24 Q23.6 24.2 26 25.2 L25.6 32.4 Q23 33.4 20 33.6Z" ${SHD}/>
      <path d="M15.2 26.2 Q20 24.9 24.8 26.2 L24.5 31.6 Q20 33 15.5 31.6Z" fill="none" stroke="${M.l}" stroke-width=".55" stroke-dasharray="1 .8"/>
      <circle cx="20" cy="29" r="1" fill="${M.d}" ${OL}/>`;
    return s;
  }
  if(t===2){   // どうの むねあて ＋ かたあて
    s+=`<path d="M13.2 25 Q20 23.2 26.8 25 L26.6 33 Q20 35.2 13.4 33Z" fill="${M.b}" ${OL}/>
      <path d="M20 23.8 Q24 24 26.8 25 L26.6 33 Q23.4 34.4 20 34.6Z" ${SHD}/>
      <path d="M20 25 V33.4" stroke="${M.l}" stroke-width=".9" opacity=".9"/>
      <path d="M15.2 26.6 Q16.4 25.6 18 25.4" stroke="#fff" stroke-width=".8" fill="none" stroke-linecap="round" opacity=".7"/>
      ${rivet(14.8,26.6)}${rivet(25.2,26.6)}${rivet(15.1,31.8)}${rivet(24.9,31.8)}
      ${MIR(`<ellipse cx="11.4" cy="25.6" rx="3.7" ry="2.7" transform="rotate(-22 11.4 25.6)" fill="${M.b}" ${OL}/>
        <path d="M8.6 25.6 Q9.6 23.8 11.8 23.6" stroke="#fff" stroke-width=".7" fill="none" opacity=".6"/>${rivet(11.2,25.6)}`)}`;
    return s;
  }
  // 3〜7：どうを ぜんぶ おおう よろい
  s+=`<path d="M12 25.4 Q20 22.6 28 25.4 L28.8 33.6 Q20 36.6 11.2 33.6Z" fill="${M.b}" ${OL}/>
    <path d="M20 23.8 Q24.6 24 28 25.4 L28.8 33.6 Q24.6 35 20 35.2Z" ${SHD}/>
    <path d="M14.6 26.6 Q16.4 25.2 18.6 25" stroke="#fff" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".6"/>`;
  if(tr) s+=`<path d="M12.7 26.3 Q20 23.6 27.3 26.3 M11.9 32.9 Q20 35.8 28.1 32.9" stroke="${tr}" stroke-width="1" fill="none"/>`;
  else s+=`<path d="M20 24 V34.8" stroke="${INK}" stroke-width=".7" opacity=".45"/>`;
  // こしの いた（タセット）
  s+=`<path d="M11.4 34.4 H28.6 L28.4 39 H11.6Z" fill="${M.b}" ${OL}/>
    <path d="M16.2 34.4 V39 M23.8 34.4 V39" stroke="${INK}" stroke-width=".7"/>
    <path d="M20 34.4 H28.6 L28.4 39 H20Z" ${SHD}/>`;
  if(tr) s+=`<path d="M11.7 38.2 H28.3" stroke="${tr}" stroke-width=".9"/>`;
  // まえかけ（きし いじょう）
  if(t>=5) s+=`<path d="M17.4 34 H22.6 L22.2 42.4 L20 41.2 L17.8 42.4Z" fill="${c}" ${OL}/>
    <path d="M18 34.6 H22 M18.2 40.6 L20 39.6 L21.8 40.6" stroke="${tr}" stroke-width=".7" fill="none"/>
    ${t>=6?`<path d="M20 35.8 L21.2 37.3 L20 38.8 L18.8 37.3Z" fill="${tr}" ${OL}/>`:""}`;
  // うでの こて（はがね いじょう）
  if(t>=4) s+=MIR(`<path d="M6.4 30.4 Q8.6 29.6 10.8 30.4 L10.6 33.6 Q8.5 34.2 6.4 33.6Z" fill="${M.b}" ${OL}/>
    <path d="M8.6 29.9 Q9.8 30 10.8 30.4 L10.6 33.6 Q9.6 33.9 8.6 34Z" ${SHD}/>
    ${tr?`<path d="M6.5 32.9 Q8.5 33.5 10.6 32.9" stroke="${tr}" stroke-width=".8" fill="none"/>`:""}`);
  // かたあて
  let pd=`<path d="M6.6 29.6 Q6.8 23.4 13.8 23.6 L15.2 28.6 Q10.6 27.6 6.6 29.6Z" fill="${M.b}" ${OL}/>
    <path d="M8 27.4 Q9.6 25 13 25" stroke="#fff" stroke-width="1" fill="none" opacity=".55"/>`;
  if(t>=4) pd=`<path d="M5.4 31.8 Q6 27.4 11.4 27.6 L12.4 30 Q8.4 29.8 5.4 31.8Z" fill="${M.d}" ${OL}/>`+pd;   // 2だんに
  if(t===5) pd=`<path d="M8.8 24.6 L7.6 20.2 L11.8 23.4Z" fill="${M.l}" ${OL}/>`+pd;   // とげ
  if(t>=6) pd=`<path d="M10 24 Q4 21.6 1.6 15.6 Q4.6 17.8 6.4 17.6 Q4.4 15.6 4.2 12.4 Q7.4 15.8 9.2 16 Q8.4 14.4 8.8 12 Q11.4 16.4 12.6 22.4Z" fill="${tr}" ${OL}/>
    <path d="M9.6 22.4 Q6 20 4.6 17.8 M10.4 20.6 Q8.2 18 7.4 15.4" stroke="${INK}" stroke-width=".5" fill="none" opacity=".5"/>`+pd;   // つばさの かざり
  if(tr) pd+=`<path d="M7.6 28.6 Q8.4 24.6 13.4 24.6" stroke="${tr}" stroke-width=".9" fill="none"/>`;
  pd+=rivet(11.6,26);
  s+=MIR(pd);
  // むねの かざり
  if(t===3) s+=`${rivet(14.4,27)}${rivet(25.6,27)}${rivet(13.6,32.4)}${rivet(26.4,32.4)}`;
  if(t===4) s+=`<circle cx="20" cy="29.4" r="2.4" fill="${M.d}" ${OL}/>${gem(20,29.4,1.5,c)}${rivet(14.4,27)}${rivet(25.6,27)}`;
  if(t===5) s+=`<path d="M17.2 26.6 H22.8 V29.4 Q22.8 32 20 33.4 Q17.2 32 17.2 29.4Z" fill="${GOLD}" ${OL}/>${gem(20,29.4,1.3,c)}`;
  if(t>=6){
    s+=MIR(`<path d="M18 29.6 Q15.4 26.6 13 27.4 Q14.6 28.4 14.2 29.6 Q15.4 29.4 15.6 30.6 Q16.8 30.6 18 30.4Z" fill="${tr}" ${OL}/>
      <path d="M13.4 32.2 Q15.4 30.8 16.6 32.6" stroke="${tr}" stroke-width=".7" fill="none"/>`);
    s+= star ? `<polygon points="20,26.2 21.4,29 24.4,29.3 22.1,31.2 22.9,34.1 20,32.5 17.1,34.1 17.9,31.2 15.6,29.3 18.6,29" fill="#fff" ${OL}/>`
             : `<circle cx="20" cy="29.6" r="2.7" fill="${tr}" ${OL}/>${gem(20,29.6,1.9,c)}`;
  }
  if(t===7) s+=spark(4.6,22.4,1.8)+spark(36.2,20.6,1.4)+spark(33.8,36.4,1.2,"#fff");
  return s;
}

  // 3〜6：ほおあて つき

  if(t===5) s+=`<path d="M19.4 0 Q17.6 -6.4 23.4 -7.6 Q30.2 -8.4 35 -3 Q31 -4.4 28.4 -3.8 Q32.4 -1.6 33 2.4 Q28.6 -1 24.8 -1 Q22.6 -0.6 21.6 0.8Z" fill="${c}" ${OL}/>
    <path d="M22 -1.6 Q25 -5.2 31.6 -4.4 M23.6 -0.6 Q27.6 -2.4 31.4 0.4" stroke="#fff" stroke-width=".6" fill="none" opacity=".6"/>`;   // はねかざり
  if(t>=6) s+=MIR(`<path d="M8 9.4 Q1.4 8.6 -2.2 2 Q1.4 3.8 3.4 3.4 Q0.4 0.8 -0.4 -3 Q3.8 0.6 5.6 0.2 Q4.4 -1.8 4.8 -4.4 Q8.6 -0.6 9.6 4.6Z" fill="${GOLD}" ${OL}/>
    <path d="M7.4 7.4 Q3.4 6.2 1.4 3.6 M7.8 4.8 Q5 3.2 3.6 0.8" stroke="${INK}" stroke-width=".5" fill="none" opacity=".5"/>`);   // つばさ
  s+=`<path d="M7.4 17 Q6.2 0.8 20 0 Q33.8 0.8 32.6 17 L29.4 17 L28.8 12 Q20 9.6 11.2 12 L10.6 17Z" fill="${M.b}" ${OL}/>
    <path d="M20 0 Q33.8 0.8 32.6 17 L29.4 17 L28.8 12 Q24.6 10.8 20 10.6Z" ${SHD}/>
    <path d="M11.2 7.2 Q12.8 3 17 1.8" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".6"/>
    <path d="M7.9 11.6 Q20 7.6 32.1 11.6 L32.2 14.2 Q20 10.4 7.8 14.2Z" fill="${tr||M.d}" ${OL}/>`;
  if(t===3) s+=`<path d="M18.8 -4.4 L20 -7.4 L21.2 -4.4 L21.2 0.2 H18.8Z" fill="${M.l}" ${OL}/><path d="M20 0.4 V10.2" stroke="${INK}" stroke-width=".8" opacity=".5"/>
    ${rivet(10.6,12.6)}${rivet(15.6,10.8)}${rivet(24.4,10.8)}${rivet(29.4,12.6)}`;
  if(t===4) s+=`<path d="M20 0.4 V10.2" stroke="${INK}" stroke-width=".8" opacity=".5"/>
    ${MIR(`<path d="M7.8 6.8 Q3 5.8 2.6 1 Q5.4 4.4 8.8 4.4Z" fill="${M.l}" ${OL}/>`)}${rivet(15.6,10.8)}${rivet(24.4,10.8)}`;
  if(t>=5) s+=`<path d="M10.8 16.6 L11.2 12.2 M29.2 16.6 L28.8 12.2" stroke="${tr}" stroke-width=".9"/>${gem(20,10.6,t>=6?1.9:1.4,c)}`;
  if(t>=6) s+=`<path d="M17.6 0.6 L20 -6 L22.4 0.6Z" fill="${GOLD}" ${OL}/>${gem(20,-1.4,1,"#fff")}`;

function swordSVG(t,c){
  const M= t===1 ? {b:"#c99260",d:"#8a5a32",l:"#e8c49a"} : t===7 ? {b:"#fff6c2",d:"#c9a000",l:"#fff"} : MAT[t===6?5:t];
  const top=[0,15,8,4,1,-1.4,-4.2,-4.2][t], w=[0,1.4,1.5,1.7,1.9,2.3,2.5,2.5][t];
  const x0=31.6-w, x1=31.6+w;
  let s="";
  if(t>=6) s+=`<path d="M31.6 ${top-2} L${x1+3} ${top+5} L${x1+3} 31 L${x0-3} 31 L${x0-3} ${top+5}Z" fill="${t===7?"#fff59d":"#9fe3ff"}" opacity=".45"/>
    ${spark(24.6,4,2.2,t===7?"#ffd54f":"#bdefff")}${spark(38.6,13,1.6,t===7?"#ffd54f":"#bdefff")}${spark(25.4,22,1.2,"#fff")}`;
  // は
  s+= t===1 ? `<path d="M${x0} 31.4 V${top+1.6} Q31.6 ${top-1.2} ${x1} ${top+1.6} V31.4Z" fill="${M.b}" ${OL}/>
      <path d="M31 ${top+3} V30 M32.3 ${top+6} V29" stroke="${M.d}" stroke-width=".5" opacity=".7"/>`
    : `<path d="M${x0} 31.6 V${top+3} L31.6 ${top} L${x1} ${top+3} V31.6Z" fill="${M.b}" ${OL}/>
      <path d="M31.6 ${top} L${x1} ${top+3} V31.6 H31.6Z" fill="${M.d}" opacity=".45"/>
      <path d="M${x0+.7} ${top+4} V29.6" stroke="#fff" stroke-width=".7" stroke-linecap="round" opacity=".85"/>`;
  if(t>=3 && t<=4) s+=`<path d="M31.6 ${top+4} V29.6" stroke="${M.d}" stroke-width=".8"/>`;
  if(t===5) s+=`<path d="M31.6 ${top+4} V29.6" stroke="${GOLD}" stroke-width="1"/>`;
  if(t>=6) s+=`<path d="M31.6 ${top+4} V29.6" stroke="${t===7?"#ffb300":"#3fc2ff"}" stroke-width="1.3"/>
    <path d="M31.6 ${top+9} l1 1.4 -1 1.4 -1-1.4z M31.6 ${top+17} l1 1.4 -1 1.4 -1-1.4z" fill="#fff"/>`;
  // つば
  if(t===1) s+=`<rect x="28" y="31" width="7.2" height="2.2" rx=".9" fill="${M.d}" ${OL}/>`;
  if(t===2) s+=`<path d="M27 31 H36.2 V33.2 H27Z" fill="${MAT[2].d}" ${OL}/>`;
  if(t===3) s+=`<path d="M26.4 31.1 H36.8 V33.1 H26.4Z" fill="${M.d}" ${OL}/><circle cx="26.2" cy="32.1" r="1.3" fill="${M.d}" ${OL}/><circle cx="37" cy="32.1" r="1.3" fill="${M.d}" ${OL}/>`;
  if(t===4) s+=`<path d="M25 29.8 Q27 32.4 31.6 32 Q36.2 32.4 38.2 29.8 L38.2 32.6 Q36 34.8 31.6 34.4 Q27.2 34.8 25 32.6Z" fill="${M.d}" ${OL}/>${gem(31.6,33.2,1.1,c)}`;
  if(t>=5){
    const g = t===5 ? `<path d="M24.2 29.2 Q27 31 29.2 31.4 L31.6 32.6 L34 31.4 Q36.2 31 39 29.2 Q38.4 33 34.6 34.4 H28.6 Q24.8 33 24.2 29.2Z" fill="${GOLD}" ${OL}/>`
      : `<path d="M31.6 32.6 L29 31.4 Q25.6 31 23.6 28.2 Q22.4 30.4 23.4 31.6 Q22 32.2 22.2 33.4 Q24.6 34.8 28.6 34.6 H34.6 Q38.6 34.8 41 33.4 Q41.2 32.2 39.8 31.6 Q40.8 30.4 39.6 28.2 Q37.6 31 34.2 31.4Z" fill="${GOLD}" ${OL}/>
        <path d="M24 31.6 Q26.4 32.6 28.4 32.6 M39.2 31.6 Q36.8 32.6 34.8 32.6" stroke="${INK}" stroke-width=".5" fill="none" opacity=".55"/>`;
    s+=g+gem(31.6,33.2,t>=6?1.6:1.3,c);
  }
  // にぎり と おしり
  const grip = t>=5 ? "#2b4fb8" : t===1 ? "#e8e0d0" : "#5d3a22";
  s+=`<rect x="30.5" y="${t>=4?34.8:33.2}" width="2.2" height="6" fill="${grip}" ${OL}/>`;
  if(t===1) s+=`<path d="M30.6 35 L32.6 34.2 M30.6 37 L32.6 36.2 M30.6 39 L32.6 38.2" stroke="${INK}" stroke-width=".4"/>`;
  s+= t>=4 ? `<path d="M31.6 40.2 L33.4 42 L31.6 43.8 L29.8 42Z" fill="${t>=5?GOLD:M.d}" ${OL}/>${t>=5?`<circle cx="31.6" cy="42" r=".7" fill="${c}"/>`:""}`
           : `<circle cx="31.6" cy="40.4" r="1.2" fill="${t===1?M.d:t===2?MAT[2].d:M.d}" ${OL}/>`;
  s+=`<circle cx="31.6" cy="37" r="2.3" fill="${SKIN}" ${OL}/>`;
  return s;
}

function shieldSVG(i){
  const I=ISLANDS[i], t=i+1, M=MAT[t];
  const emb=(cx,cy,r)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff8ec" ${OL}/>`+
    monsterSVG(I.type,I.color).replace("<svg ",`<svg x="${cx-r*1.17}" y="${cy-r*1.26}" width="${r*2.33}" height="${r*2.33}" `);
  let s="";
  if(t<=2){   // まるい きの たて
    s+=`<circle cx="6.5" cy="35.6" r="7.8" fill="${MAT[1].b}" ${OL}/>
      <path d="M3.2 29 V42.2 M6.5 28 V43.2 M9.8 29 V42.2" stroke="${MAT[1].d}" stroke-width=".7"/>
      <path d="M6.5 27.8 A7.8 7.8 0 0 1 6.5 43.4Z" ${SHD}/>`;
    if(t===2) s+=`<circle cx="6.5" cy="35.6" r="7.2" fill="none" stroke="${MAT[3].b}" stroke-width="1.6"/>
      <circle cx="6.5" cy="35.6" r="7.8" fill="none" ${OL}/>${rivet(6.5,28.6)}${rivet(6.5,42.6)}${rivet(-0.5,35.6)}${rivet(13.5,35.6)}`;
    return s+emb(6.5,35.6,t===1?3.6:4);
  }
  const big=t>=5;
  const out = big ? "M-2.6 26.6 Q6.5 24.4 15.6 26.6 V34.2 Q15.6 43 6.5 47 Q-2.6 43 -2.6 34.2Z"
                  : "M-1.6 27.2 Q6.5 25.2 14.6 27.2 V34.2 Q14.6 42.4 6.5 46 Q-1.6 42.4 -1.6 34.2Z";
  const inn = big ? "M-0.6 28.4 Q6.5 26.8 13.6 28.4 V34.2 Q13.6 41.4 6.5 44.8 Q-0.6 41.4 -0.6 34.2Z"
                  : "M0.4 28.8 Q6.5 27.4 12.6 28.8 V34.2 Q12.6 40.8 6.5 43.8 Q0.4 40.8 0.4 34.2Z";
  if(t>=6) s+=MIR(`<path d="M-1 30.4 Q-3.6 29.2 -4 26 Q-2.6 27 -1.8 26.8 Q-3 25.2 -3 23 Q-1.4 25 -0.4 25.2 Q-0.6 24 -0.2 22.6 Q1.4 25.2 1.4 28.4Z" fill="${GOLD}" ${OL}/>`,6.5);
  s+=`<path d="${out}" fill="${big?GOLD:M.b}" ${OL}/>
    <path d="${inn}" fill="${I.color}" ${OL}/>
    <path d="M6.5 ${big?26.8:27.4} Q10 ${big?27.4:27.8} ${big?13.6:12.6} ${big?28.4:28.8} V34.2 Q${big?13.6:12.6} ${big?41.4:40.8} 6.5 ${big?44.8:43.8}Z" ${SHD}/>
    <path d="M1.6 30.4 Q3.6 29.4 6 29.2" stroke="#fff" stroke-width="1" fill="none" opacity=".7"/>`;
  if(t===4) s+=`<path d="M6.5 28 V43.4 M0.6 34.4 H12.4" stroke="${M.d}" stroke-width="1.4" opacity=".8"/>`;
  if(t>=4) s+=`<circle cx="6.5" cy="35.4" r="${big?6.6:6.1}" fill="${GOLD}" ${OL}/>`;
  s+=emb(6.5,35.4,big?5.4:t===4?5:5.4);
  if(t===3) s+=`${rivet(-0.4,28.4)}${rivet(13.4,28.4)}${rivet(6.5,44.8)}`;
  if(t===4) s+=`${rivet(-0.4,28.4)}${rivet(13.4,28.4)}${rivet(1,40.4)}${rivet(12,40.4)}`;
  if(t>=5) s+=gem(6.5,27.2,1.3,"#e53935")+`${rivet(-1.6,28.4,"#fff3b0")}${rivet(14.6,28.4,"#fff3b0")}`;
  if(t>=6) s+=spark(-3.4,40.6,1.4)+spark(16.6,42.2,1.1,"#fff");
  return s;
}

let actx=null;
function tone(notes,type,vol,step){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const t=actx.currentTime+i*step;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+step+0.07);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+step+0.1);
    });
  }catch(e){}
}

      const cls="node"+(boss?" boss":"")+(k<pos?" done":"")+(k===pos&&!done?" cur":"")+(A.moved===k?" pop":"");

  });

  if(A.moved!==undefined){ delete A.moved; saveAdv(A); }
  return curI;
}

/* ================= もんだい づくり ================= */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const qkey=q=>`${q.L.id}-${q.a}-${q.b}`;
function makeQuestions(L,n){
  const pool=L.pool().map(p=>({...p,L})); let out=[];
  while(out.length<n){
    const s=shuffle(pool.slice());
    if(out.length && s.length>1 && qkey(s[0])===qkey(out[out.length-1])) s.push(s.shift());  // おなじ もんだいが つづかないように
    out=out.concat(s);
  }
  return out.slice(0,n);
}
// ボス：はんぶんは その しまの レベル、はんぶんは これまでの レベル（さいごの しまは ぜんぶ）
// イージーは まぜない（その しまの レベルだけ）
function bossQuestions(i,n,d){
  const out=[]; let last="";
  for(let k=0;k<n;k++){
    let id;
    if(d==="easy") id=i+1;
    else if(i===ISLANDS.length-1) id=1+Math.floor(Math.random()*LEVELS.length);
    else if(i===0 || Math.random()<0.5) id=i+1;
    else id=1+Math.floor(Math.random()*i);
    const L=LEVELS[id-1], pool=L.pool();
    let q, tries=0;
    do{ q={...pool[Math.floor(Math.random()*pool.length)],L}; }while(qkey(q)===last && ++tries<10);
    last=qkey(q); out.push(q);
  }
  return out;
}

/* ================= そろばん ================= */
// ひだりに よせた たまが かぞえる たま。もんだいに あわせて たまを おいておく。
// SB = {q, id, rows:[{beads:[いろ], n:ひだりの かず, slots, erase}], loose:バラの かず}
let SB=null;
function soroInit(q){
  const id=q.L.id, a=q.a, b=q.b, C=k=>k<5?"c1":"c2";
  const row=(cnt,n,slots=13,erase=false,fixed=false)=>({beads:Array.from({length:cnt},(_,k)=>C(k)),n,slots,erase,fixed});
  let rows, loose=0;
  if(id===1)      rows=[row(5,a,8)];                 // 5だま：ひだりに a、みぎに のこり
  else if(id===2) rows=[row(10,a)];                  // 10だま：ひだりに a、みぎに のこり
  else if(id===3) rows=[row(a+b,a)];                 // ひつような かずだけ：ひだりに a、みぎに b
  else if(id===4) rows=[row(a,a)];                   // ひつような かずだけ：ひだりに a
  // 20だまの わくは 10こで ちょうど いっぱいの はば（slots=10）。たまは よこに うごかさない。
  else if(id===5){ rows=[row(a,a,10,false,true),row(0,0,10,false,true)]; loose=b; }   // うえに a、わくの そとに バラ b
  else rows=[row(10,10,10,true),row(a-10,a-10,10,false,true)];                       // うえに 10（けせる）、したに のこり
  return {q,id,rows,loose};
}
function setupSoro(q){ clearTimeout(warnT); warnT=null; SB=soroInit(q); buildSoro(); }
// レベル4（ひきざん）：みぎへ うごかした（ひいた）たまは うすく する
function fadeOf(R,k){ return SB && SB.id===4 && k>=R.n; }
function beadX(R,k){ return k<R.n ? k : R.slots-R.beads.length+k; }
function buildSoro(){
  const S=SB, el=$("soro");
  el.style.setProperty("--slots",S.rows[0].slots);
  el.classList.toggle("haslo",S.id===5);
  $("sframe").innerHTML=S.rows.map((R,r)=>`<div class="rod" data-r="${r}">`+
    R.beads.map((c,k)=>`<button class="bead ${c}${fadeOf(R,k)?' faded':''}" data-k="${k}" style="--x:${beadX(R,k)}" tabindex="-1" aria-label="たま"></button>`).join("")+`</div>`).join("");
  $("sloose").innerHTML=Array.from({length:S.loose},(_,k)=>`<button class="bead lb c3" data-l="${k}" tabindex="-1" aria-label="バラの たま"></button>`).join("");
  // レベル5：うえの だんが 10に なったら ひかって おなじ いろに
  if(S.id===5 && S.rows[0].beads.length===10){
    const rod=$("sframe").querySelector(".rod");
    rod.classList.add("ten");
    if(!S.tenShown){ S.tenShown=true; rod.classList.add("tenflash"); tone([784,988,1175,1568],"triangle",.16,.09); }
  }
  sizeLoose(); clearTimeout(warnT); warnT=null; soroGuide();
}
function drawSoro(){
  $("sframe").querySelectorAll(".rod").forEach((rod,r)=>{
    const R=SB.rows[r];
    rod.querySelectorAll(".bead").forEach((b,k)=>{ b.style.setProperty("--x",beadX(R,k)); b.classList.toggle("faded",fadeOf(R,k)); });
  });
  clearTimeout(warnT); warnT=null; soroGuide();
}
function sizeLoose(){
  if(!SB || SB.id!==5) return;
  const W=$("soro").clientWidth; if(!W) return;
  $("soro").style.setProperty("--bd",Math.max(18,Math.floor((W-56)/(SB.rows[0].slots+3)))+"px");
}
window.addEventListener("resize",sizeLoose);

// ガイドの ことば
let warnT=null;
function soroGuide(){
  if(!SB || warnT) return;
  const S=SB, {a,b}=S.q, R=S.rows[0]; let m="", c="";
  switch(S.id){
    case 1: case 2: m="みぎの たまは いくつ？"; break;
    case 3: if(R.n===R.beads.length){ m="ぜんぶで いくつ？"; c="ok"; } else m="たす かずだけ、みぎの たまを ひだりへ うごかそう"; break;
    case 4: if(R.n===a-b){ m="のこりは いくつ？"; c="ok"; } else if(R.n<a-b) m="うごかしすぎたよ。ひく かずだけ うごかそう"; else m="ひく かずだけ、たまを みぎへ うごかそう"; break;
    case 5:
      if(R.beads.length<10) m="あと いくつで 10？ バラの たまを うえの だんへ スワイプしよう";
      else if(S.loose>0){ m="10が できた！ のこりの バラを したの だんへ スワイプしよう"; c="ok"; }
      else { m="10と いくつ？ ぜんぶで いくつ？"; c="ok"; }
      break;
    case 6: {
      const rm=10-R.beads.length;
      if(rm<b) m="10から ひこう。のこりは いくつ？（うえの たまを みぎへ スワイプ）";
      else if(rm===b){ m="のこりと したの たまを あわせて いくつ？"; c="ok"; }
      else { m="ひきすぎたよ。「たまを もどす」で やりなおそう"; c="ng"; }
    }
  }
  const g=$("sGuide"); g.textContent=m; g.className=c;
}
function soroWarn(m){
  clearTimeout(warnT); const g=$("sGuide"); g.textContent=m; g.className="ng";
  warnT=setTimeout(()=>{ warnT=null; soroGuide(); },1800);
}

// そうさ
let sDrag=null;
$("soro").addEventListener("pointerdown",e=>{
  const b=e.target.closest(".bead"); if(!b || !SB) return;
  e.preventDefault();
  sDrag={b,x:e.clientX,y:e.clientY,loose:b.classList.contains("lb")};
  if(sDrag.loose){ b.classList.add("drag"); try{ b.setPointerCapture(e.pointerId); }catch(_){} }
});
window.addEventListener("pointermove",e=>{
  if(sDrag && sDrag.loose) sDrag.b.style.transform=`translate(${e.clientX-sDrag.x}px,${e.clientY-sDrag.y}px)`;
});
window.addEventListener("pointercancel",()=>{
  if(sDrag && sDrag.loose){ sDrag.b.classList.remove("drag"); sDrag.b.style.transform=""; }
  sDrag=null;
});
window.addEventListener("pointerup",e=>{
  if(!sDrag) return;
  const d=sDrag; sDrag=null;
  if(d.loose) dropLoose(d,e); else rowAct(d,e.clientX-d.x);
});
// ふつうの だん：タッチ・スライドで うごかす／レベル6の うえの だん：みぎへ スワイプで けす
function rowAct(d,dx){
  const rod=d.b.parentNode, r=+rod.dataset.r, k=+d.b.dataset.k, R=SB.rows[r], n=R.n;
  if(R.erase){
    if(dx<=12){ if(Math.abs(dx)<=12) soroWarn("たまを みぎへ スワイプして けそう"); return; }
    [...rod.querySelectorAll(".bead")].slice(k).forEach(x=>x.classList.add("gone"));
    tone([520,390],"sine",.05,.05);
    const S=SB;
    setTimeout(()=>{ if(SB!==S) return; R.beads=R.beads.slice(0,k); R.n=Math.min(R.n,k); buildSoro(); },230);
    return;
  }
  if(R.fixed) return;
  let nn;
  if(dx<-12) nn=Math.max(n,k+1);        // ひだりへ スライド
  else if(dx>12) nn=Math.min(n,k);      // みぎへ スライド
  else nn = k<n ? k : k+1;              // タッチ
  if(nn!==n){ R.n=nn; drawSoro(); tone([nn>n?700:520],"sine",.05,.03); }
}
// バラの たま：うえ・したの だんへ スワイプ（タッチなら あいている だんへ）
function dropLoose(d,e){
  const b=d.b; b.classList.remove("drag");
  const back=()=>{ b.style.transform=""; };
  let r=-1;
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>12){
    let best=1e9;
    $("sframe").querySelectorAll(".rod").forEach((rod,i)=>{
      const B=rod.getBoundingClientRect();
      if(e.clientX<B.left-20 || e.clientX>B.right+30) return;
      const dy=Math.abs(e.clientY-(B.top+B.height/2));
      if(dy<best && dy<B.height*1.4){ best=dy; r=i; }
    });
  }else r = SB.rows[0].beads.length<10 ? 0 : 1;
  if(r<0){ back(); return; }
  if(r===1 && SB.rows[0].beads.length<10){ back(); soroWarn("さきに うえの だんを 10に しよう"); return; }
  const R=SB.rows[r];
  if(R.beads.length>=10){ back(); soroWarn("うえの だんは もう いっぱい。したの だんへ"); return; }
  R.beads.splice(R.n,0,"c3"); R.n++; SB.loose--;
  buildSoro(); tone([700,880],"sine",.06,.04);
}
$("soroReset").addEventListener("click",()=>{ if(SB){ clearTimeout(warnT); warnT=null; setupSoro(SB.q); } });

/* ================= ゲーム ================= */
let G=null, timerId=null;

// mode: practice（れんしゅう）/ free（チャレンジ）/ review（ふくしゅう）/ stage / boss
function start(mode,opt){
  let qs, L=opt.L||null, tag, col;
  if(mode==="stage"||mode==="boss") opt.d=opt.d||curDiff();
  if(mode==="practice"){ qs=makeQuestions(L,PR_N); tag=`れんしゅう Lv${L.id}`; col=L.color; }
  else if(mode==="free"){ qs=makeQuestions(L,count); tag=`レベル${L.id}`; col=L.color; }
  else if(mode==="review"){ qs=shuffle(opt.list.slice()); tag="ふくしゅう"; col=opt.color||"var(--blue)"; }
  else if(mode==="stage"){ L=LEVELS[opt.i]; qs=makeQuestions(L,STAGE_N); tag=`ステージ ${opt.i+1}-${opt.s+1}`; col=ISLANDS[opt.i].color; }
  else { qs=bossQuestions(opt.i,40,opt.d); tag=`ボス せん（${DIFFS[opt.d].name}）`; col=ISLANDS[opt.i].color; }
  G={mode,opt,L,qs,i:0,input:"",wrong:[],correct:0,hints:0,lock:false,t0:performance.now(),color:col,
     origin: opt.origin || ((mode==="stage"||mode==="boss") ? "adv" : "home")};
  G.pr = mode==="practice" || !!opt.pr;   // そろばん つき・やりなおし あり
  $("play").classList.toggle("bossmode",mode==="boss");
  $("play").classList.toggle("easy",mode==="boss" && opt.d==="easy");
  $("play").classList.toggle("prmode",G.pr);
  $("pTag").textContent=tag; $("pTag").style.background=col; $("pBar").style.background=col;
  if(mode==="boss"){
    const I=ISLANDS[opt.i], max = opt.i===ISLANDS.length-1 ? 150 : 100;
    G.boss={hp:max,max,hearts:3,over:null,sword:false,shield:false};
    G.bag=bagOf(loadAdv(opt.d)); G.used={herb:0,sword:0,shield:0};
    $("bName").textContent=I.boss; $("bIsl").textContent=I.name;
    const sh = opt.d!=="easy" ? G.bag.shield : 0, g0=G;
    G.boss.sw=swordTier();
    $("bHero").innerHTML=heroSVG(); heroAnim("enter");
    $("bSlash").className="slash";
    bossMsg("ゆうしゃが あらわれた！");
    const n0=msgN;
    setTimeout(()=>{ if(G===g0 && msgN===n0)
      bossMsg(`${I.boss}が あらわれた！` + (sh>0 ? `<br><span class="gold">たてが ${sh}こ</span> じかんぎれの こうげきを まもって くれるよ。` : "")); },1100);
    $("bGuard").className="guard"; $("bHeal").className="heal";
    $("bMon").className="monster"; $("bMon").innerHTML=monsterSVG(I.type,I.color);
    $("bDmg").className="dmg";
    drawBoss(); drawItems();
  }
  show("play"); nextQ();
  if(mode==="boss") pauseShift(1100);   // とうじょうの あいだは ゲージを すすめない
  clearInterval(timerId);
  timerId=setInterval(()=>{ if(!G) return; $("pTime").textContent=fmt(performance.now()-G.t0); if(G.mode==="boss") bossTick(); },100);
}

function nextQ(){
  G.input=""; $("frame").innerHTML=""; G.qStart=performance.now(); G.tries=0;
  if(G.mode==="boss"){ G.boss.atk0=G.qStart; G.boss.warned=false; drawAtk(0); }
  if(G.pr) setupSoro(G.qs[G.i]);
  $("hintBtn").style.display = G.qs[G.i].L.type==="comp" ? "" : "none";
  drawQ();
}
function drawQ(){
  const q=G.qs[G.i];
  const a = G.input==="" ? `<span class="ans empty">0</span>` : `<span class="ans">${G.input}</span>`;
  $("qText").innerHTML=textOf(q,a);
  $("pNum").textContent=`${G.i+1}/${G.qs.length}`;
  $("pBar").style.width=(G.i/G.qs.length*100)+"%";
}
function drawFrame(){
  const q=G.qs[G.i], L=q.L; let h="";
  (L.total===10 ? [0,5] : [0]).forEach(s=>{
    h+='<div class="row">'; for(let k=s;k<s+5;k++) h+=`<span class="dot ${k<q.a?'f':''}"></span>`; h+='</div>';
  });
  $("frame").innerHTML=h;
}

function press(k){
  if(!G || G.lock) return;
  if(k==="del"){ G.input=G.input.slice(0,-1); drawQ(); return; }
  if(G.input.length>=2) return;
  G.input += k;
  drawQ();
  // こたえの けた数まで おしたら（または ちがう数字を おしたら）すぐ はんてい
  const ans=String(answerOf(G.qs[G.i]));
  if(G.input.length>=ans.length || !ans.startsWith(G.input)) judge();
}

function judge(){
  G.lock=true;
  const q=G.qs[G.i], ans=answerOf(q), v=+G.input, ok=v===ans, el=performance.now()-G.qStart;
  const m=$("mark"), g0=G;
  $("markCor").classList.remove("retry");
  if(!ok && G.pr && G.tries===0){   // れんしゅう：1かいめの まちがいは もういちど
    G.tries=1;
    m.className="mark show ng"; $("markSym").textContent="×";
    $("markCor").textContent="もういちど かんがえよう"; $("markCor").classList.add("retry"); $("markCor").style.display="";
    beep(false); $("qbox").classList.remove("shake"); void $("qbox").offsetWidth; $("qbox").classList.add("shake");
    setTimeout(()=>{ if(G!==g0) return; $("mark").className="mark"; G.input=""; drawQ(); G.lock=false; },1000);
    return;
  }
  m.className="mark show "+(ok?"ok":"ng");
  $("markSym").textContent= ok ? "○" : "×";
  $("markCor").textContent= ok ? "" : `こたえは ${ans}`;
  $("markCor").style.display= ok ? "none" : "";
  if(!(ok && G.mode==="boss")) beep(ok);
  if(ok) G.correct++;
  else { G.wrong.push({q,mine:v}); $("qbox").classList.remove("shake"); void $("qbox").offsetWidth; $("qbox").classList.add("shake"); }
  if(G.mode==="boss") bossHit(ok,el);
  const g=G;
  setTimeout(()=>{
    if(G!==g) return;           // とちゅうで やめた とき
    $("mark").className="mark";
    if(G.mode==="boss"){
      if(G.boss.over==="win"){ $("bMon").className="monster down"; fanfare(); setTimeout(()=>{ if(G===g) finish(); },1100); return; }
      if(G.boss.over==="lose"){ finish(); return; }
      G.i++; if(G.i>=G.qs.length) G.qs=G.qs.concat(bossQuestions(G.opt.i,30,G.opt.d));
      G.lock=false; nextQ(); return;
    }
    G.i++; G.lock=false;
    if(G.i>=G.qs.length) finish(); else nextQ();
  }, ok?450:1400);
}

/* ---- ボス せん ---- */
function bossHit(ok,el){
  const b=G.boss, mon=$("bMon"), d=$("bDmg");
  mon.className="monster"; void mon.offsetWidth;
  if(ok){
    const f = G.opt.i>=4 ? 1.4 : 1;   // くりあがり・くりさがりの しまは じかんを ながめに
    let dmg, crit=false;
    if(el<2500*f){ dmg=15; crit=true; } else if(el<5000*f) dmg=10; else dmg=6;
    if(b.sword) dmg+=SWORD_DMG;

function bossTick(){

function showSlash(t,crit){
  const S=SLASH[t], el=$("bSlash");
  const line=(d,delay)=>`<path class="s" d="${d}" pathLength="100" fill="none" stroke="${S.g}" stroke-width="${S.w*2.6}" stroke-linecap="round" opacity=".5" style="animation-delay:${delay}ms"/>
    <path class="s" d="${d}" pathLength="100" fill="none" stroke="${S.c}" stroke-width="${S.w}" stroke-linecap="round" style="animation-delay:${delay}ms"/>`;
  let h="";
  if(t>0){
    h+=line("M14 20 Q50 40 86 80",0);
    if(S.n===2) h+=line("M8 38 Q42 56 74 92",90);
    if(S.x) h+=line("M86 20 Q50 40 14 80",120);
  }
  const r = t===0 ? 16 : 10;
  h+=`<g class="boom" style="animation-delay:${t===0?0:140}ms"><polygon points="${[...Array(16)].map((_,k)=>{const a=k*Math.PI/8, R=k%2?r*.45:r; return `${50+R*Math.cos(a)},${50+R*Math.sin(a)}`;}).join(" ")}" fill="${S.c}" stroke="${S.g}" stroke-width="1.5"/></g>`;
  if(t>=6) h+=[[22,30,4],[80,46,3],[60,84,3.4],[34,70,2.6]].map(([x,y,z],k)=>`<g class="sp" style="animation-delay:${160+k*60}ms;transform-origin:${x}px ${y}px">${spark(x,y,z,k%2?"#fff":S.g)}</g>`).join("");
  el.innerHTML=`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${h}</svg>`;
  el.className="slash"; void el.offsetWidth; el.className="slash show"+(crit?" crit":"");
  if(crit){ const p=$("bossPanel"); p.classList.remove("critfx"); void p.offsetWidth; p.classList.add("critfx"); }
}

let msgTimer=null, msgN=0;
function bossMsg(html){
  clearInterval(msgTimer); msgN++;
  const el=$("bMsg"), parts=html.split(/(<[^>]+>)/);   // タグは そのまま、もじだけ じゅんばんに
  let shown="", pi=0, ci=0;
  const step=()=>{
    for(let n=0;n<2 && pi<parts.length;n++){
      while(pi<parts.length && (parts[pi].startsWith("<") || ci>=parts[pi].length)){
        if(parts[pi].startsWith("<")) shown+=parts[pi]; pi++; ci=0;
      }
      if(pi<parts.length){ shown+=parts[pi][ci++]; }
    }
    const open=(shown.match(/<span/g)||[]).length-(shown.match(/<\/span>/g)||[]).length;
    el.innerHTML=shown+"</span>".repeat(Math.max(0,open))+(pi<parts.length?"":'<span class="cur">▼</span>');
    if(pi>=parts.length) clearInterval(msgTimer);
  };
  step(); msgTimer=setInterval(step,30);
}
