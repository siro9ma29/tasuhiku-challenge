function finish(){
  clearInterval(timerId);
  $("rStars").innerHTML=""; $("rItems").innerHTML="";
  const t=performance.now()-G.t0, mode=G.mode, L=G.L;
  let newB=[], banner="", title="", big="", tm=`タイム　${fmt(t)}びょう`, msg="", note="", art="", artCls="";
  let againLabel="もういちど", showAgain=true, primary="again";

  if(mode==="practice"){
    const n=G.qs.length;
    title=`れんしゅう　レベル${L.id}　${L.name}`;
    big=`${G.correct}<small> / ${n}もん</small>`; tm="";
    msg = G.correct===n ? "ぜんぶ できたね！ チャレンジモードにも ちょうせんしよう！"
        : G.correct>=n-1 ? "よく できました！" : "もう いちど れんしゅう してみよう！";
    if(G.correct===n){ fanfare(); primary="next"; }
    newB=awardBadges([],G.correct);
    note="れんしゅうモードの けっかは じこベストに のこりません。";
  }
  else if(mode==="free" || mode==="review"){
    const n=G.qs.length, rate=G.correct/n;
    title = mode==="free" ? `レベル${L.id}　${L.name}` : "ふくしゅう";
    big=`${G.correct}<small> / ${n}もん</small>`;
    msg = rate===1 ? "ぜんもん せいかい！すごい！" : rate>=0.8 ? "よく できました！" : rate>=0.5 ? "その ちょうし！" : "もう いちど やってみよう！";
    if(mode==="free"){
      const rec=loadRec(), key=`${L.id}-${n}`, now={c:G.correct,t:Math.round(t)};
      if(better(now,rec[key])){
        const first=!rec[key]; rec[key]=now; saveRec(rec);
        if(!first) banner="★ じこベスト こうしん！ ★";
      }
      newB=awardBadges(freeBadgeIds(L,n,G.correct,t),G.correct);
    }else{ note="ふくしゅうモードの けっかは きろくされません。"; if(G.pr) tm=""; }
    if(G.hints) note+=`　ヒントを ${G.hints}かい つかったよ。`;
  }
  else if(mode==="stage"){
    const {i,s}=G.opt, n=G.qs.length, pass=G.correct>=STAGE_PASS, k=idx(i,s), Lv=LEVELS[i];
    let moved=false;
    const A=loadAdv(G.opt.d), old=starsOf(A,k);
    const now=(pass?1:0) | (G.correct===n?2:0) | (pass && t/n<=SPEED[Lv.id]*1000 ? 4:0);
    const gain=now & ~old, bag=bagOf(A), got=[];
    STARS.forEach((S,b)=>{ const t=S.item(G.opt.d); if(t && gain>>b&1){ bag[t]++; got.push({S,t}); } });
    A.st=Object.assign({},A.st,{[k]:old|now}); A.bag=bag;
    if(pass && A.pos===k){ A.pos++; A.moved=k; moved=true; }
    saveAdv(A,G.opt.d);
    const m=old|now;
    $("rStars").innerHTML=`<div class="rstars">`+[0,1,2].map(b=>`<span class="${m>>b&1?'on':''}${gain>>b&1?' new':''}">★</span>`).join("")
      +`<small>`+STARS.map((S,b)=>`${m>>b&1?'★':'☆'}${S.name}`).join("　")+`</small></div>`;
    $("rItems").innerHTML = got.length ? `<div class="getitems"><div class="ttl">アイテムを ゲット！</div><div class="row">`+
      got.map(({S,t})=>`<div class="icard">${ico(t)}<b>${ITEMS[t].name}</b><small>${S.name}の ほし</small><small>${ITEMS[t].desc}</small></div>`).join("")+`</div></div>` : "";
    if(!(m&4) && pass) note=`1もん ${SPEED[Lv.id]}びょう いないで ぜんぶ こたえると スピードの ほしが もらえるよ。`;
    newB=awardBadges([],G.correct);
    title=`ステージ ${i+1}-${s+1}`; art=heroSVG();
    big=`${G.correct}<small> / ${n}もん</small>`;
    if(pass){ banner="★ ステージ クリア ★"; msg = moved ? "コマが 1マス すすむよ！" : "また クリアできたね！"; primary="home"; fanfare(); }
    else { msg=`クリアまで あと ${STAGE_PASS-G.correct}もん！`; againLabel="もういちど チャレンジ"; }
  }
  else { // boss
    const i=G.opt.i, I=ISLANDS[i], win=G.boss.over==="win", k=idx(i,STEPS-1), last=i===ISLANDS.length-1;
    const d=G.opt.d, ids=[]; let moved=false, unlocked=false;
    const nodmg = win && d!=="easy" && G.boss.hearts===3;
    if(win){
      ids.push(`B${i}`);
      if(nodmg) ids.push("nodmg");
      if(last) ids.push("legend");
      const was=hardOpen(loadAll());
      const A=loadAdv(d), bag=bagOf(A);
      for(const t in G.used) bag[t]=Math.max(0,bag[t]-G.used[t]);
      A.bag=bag;
      if(A.pos===k){ A.pos++; A.moved=k; moved=true; }
      saveAdv(A,d);
      unlocked = !was && hardOpen(loadAll());
    }
    newB=awardBadges(ids,G.correct);
    title=`ボス：${I.boss}`+dtag(d); art=monsterSVG(I.type,I.color); artCls=win?"beaten":"";
    big = win ? "やっつけた！" : "まけちゃった…";
    tm += `　のこりの ハート <span class="hrt">${"♥".repeat(Math.max(0,G.boss.hearts))}</span>`;
    if(win){
      banner = unlocked ? "★ ハードモードが あそべるように なった！ ★" : nodmg ? "★ ノーダメージ！ ★" : "";
      msg = last ? "ぜんぶの しまを クリア！ きみは でんせつの ゆうしゃだ！"
          : moved ? "つぎの しまへ すすめるよ！" : "また かったね！";
      showAgain=false; primary="home";
    }else{
      msg = G.boss.miss ? "ハードは 1かい まちがえると まけ。おちついて もういちど！" : "れんしゅうして、もういちど たたかおう！";
      if(Object.values(G.used).some(v=>v>0)) note="まけた ときは、つかった アイテムが もどってくるよ。";
      againLabel="もういちど たたかう";
    }
  }

  $("rTitle").innerHTML=title;
  $("rArt").innerHTML=art; $("rArt").className="rart "+artCls;
  $("rNew").innerHTML = banner ? `<span class="newrec">${banner}</span>` : "";
  $("rScore").innerHTML=big;
  $("rTime").innerHTML=tm;
  $("rMsg").textContent=msg;
  $("rBadges").innerHTML = newB.length ? `<div class="gotb"><div class="ttl">あたらしい バッヂを ゲット！</div><div class="row">`+
      newB.map(b=>badgeCard(b,true)).join("")+`</div><div class="getparts">あたらしい そうびも てに いれた！<button id="rEq">きがえる</button></div></div>` : "";
  $("rNote").textContent=note;
  if($("rEq")) $("rEq").onclick=()=>openEquip(G && G.origin==="adv" ? "map" : "home");
  if(G.wrong.length){
    $("rWrongs").innerHTML = `<h3>まちがえた もんだい</h3><ul>` + G.wrong.map(w=>

    $("revBtn").style.display="";
  }else{ $("rWrongs").innerHTML=""; $("revBtn").style.display="none"; }
  $("againBtn").textContent=againLabel;
  $("againBtn").style.display = showAgain ? "" : "none";
  $("homeBtn").textContent = G.origin==="adv" ? "マップへ もどる" : "レベルを えらぶ";
  $("nextBtn").style.display = mode==="practice" ? "" : "none";
  $("nextBtn").classList.toggle("pri",primary==="next");
  $("againBtn").classList.toggle("pri",primary==="again");
  $("homeBtn").classList.toggle("pri",primary==="home");
  show("result");
}

$("mapBack").addEventListener("click",goHome);
$("islands").addEventListener("click",onNodeTap);
$("goal").addEventListener("click",onNodeTap);
$("ovNo").addEventListener("click",()=>$("ov").classList.remove("show"));
$("ov").addEventListener("click",e=>{ if(e.target.id==="ov") $("ov").classList.remove("show"); });
$("advReset").addEventListener("click",()=>{
  const d=curDiff();
  if(confirm(`${DIFFS[d].name}の ぼうけんを さいしょから やりなおしますか？（バッヂと ほかの なんいどは のこります）`)){ saveAdv({pos:0},d); openMap(); }
});
$("resetBtn").addEventListener("click",()=>{
  if(confirm("この たんまつの きろく・バッヂ・ぼうけん・そうびを ぜんぶ けしますか？")){
    try{ [KEY,BKEY,AKEY,EKEY].forEach(k=>localStorage.removeItem(k)); }catch(e){}
    renderHome();
  }
});

// そうび
$("eqSlots").addEventListener("click",e=>{
  const b=e.target.closest(".eqp[data-slot]"); if(!b) return;
  const E=loadEq(); E[b.dataset.slot]=b.dataset.id||null; saveEq(E);
  tone([660,990],"sine",.08,.05); renderEquip();
});
$("eqBack").addEventListener("click",()=>{ eqFrom==="map" ? openMap() : goHome(); });
$("eqBtn").addEventListener("click",()=>openEquip("home"));
$("mapEq").addEventListener("click",()=>openEquip("map"));

renderHome();
</script>
