<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>たすひくチャレンジ</title>
<style>
  :root{
    --bg:#fff8ec; --card:#ffffff; --ink:#3b3a36; --sub:#8a8578;
    --blue:#3d8bfd; --green:#2bb673; --red:#ef5350; --yellow:#ffc53d; --line:#efe6d4;
    --l1:#ff8a65; --l2:#ffb74d; --l3:#81c784; --l4:#4dd0e1; --l5:#7986cb; --l6:#ba68c8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;}
  body{user-select:none;-webkit-user-select:none}
  .screen{display:none;min-height:100%;padding:16px;max-width:820px;margin:0 auto}
  .screen.active{display:flex;flex-direction:column}
  h1{text-align:center;font-size:clamp(28px,6vw,44px);margin:10px 0 4px;letter-spacing:.08em}
  h1 span{color:var(--blue)} h1 b{color:var(--red)}
  .lead{text-align:center;color:var(--sub);margin:0 0 14px;font-size:16px}
  button{font-family:inherit;cursor:pointer;border:none}

  /* ホーム */
  .count-select{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
  .count-select button{padding:10px 22px;border-radius:999px;font-size:18px;background:#fff;
    border:3px solid var(--line);color:var(--sub);font-weight:bold}
  .count-select button.on{border-color:var(--blue);color:var(--blue);background:#eaf2ff}
  .levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .lv{background:var(--card);border-radius:18px;padding:14px 16px;text-align:left;
    box-shadow:0 4px 0 var(--line);border-left:12px solid var(--c);transition:transform .08s}
  .lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .lv .no{font-size:15px;color:var(--c);font-weight:bold}
  .lv .nm{font-size:21px;font-weight:bold;margin:2px 0}
  .lv .ex{font-size:15px;color:var(--sub)}
  .lv .best{margin-top:8px;font-size:15px;background:#faf6ee;border-radius:10px;padding:6px 10px}
  .lv .best .star{color:var(--yellow)}
  .foot{margin-top:auto;padding-top:18px;text-align:center}
  .foot button{background:none;color:var(--sub);font-size:13px;text-decoration:underline}

  /* プレイ */
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .bar .tag{background:var(--c);color:#fff;border-radius:999px;padding:6px 14px;font-weight:bold;font-size:16px}
  .bar .prog{flex:1;height:14px;background:#fff;border-radius:999px;overflow:hidden;border:2px solid var(--line)}
  .bar .prog i{display:block;height:100%;width:0;background:var(--c);transition:width .2s}
  .bar .num,.bar .time{font-size:18px;font-weight:bold;min-width:64px;text-align:right}
  .bar .quit{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px;color:var(--sub)}
  .qbox{position:relative;background:var(--card);border-radius:24px;box-shadow:0 4px 0 var(--line);
    padding:22px 10px;margin:6px 0 12px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center}
  .q{font-size:clamp(44px,11vw,84px);font-weight:bold;letter-spacing:.04em;white-space:nowrap}
  .q .wd{font-size:.55em;color:var(--sub);margin:0 .15em}
  .ans{display:inline-block;min-width:1.6em;padding:0 .15em;border-bottom:6px solid var(--blue);color:var(--blue);
    background:#eaf2ff;border-radius:10px 10px 0 0;line-height:1.2}
  .ans.empty{color:transparent}
  .frame{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
  .frame .row{display:flex;gap:6px}
  .frame .dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--blue)}
  .frame .dot.f{background:var(--blue)}
  .hintbtn{position:absolute;top:10px;right:12px;background:#fff6dc;border:2px solid var(--yellow);
    color:#b07d00;border-radius:12px;padding:4px 10px;font-size:14px;font-weight:bold}
  .mark{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:24px;pointer-events:none;opacity:0;transition:opacity .1s}
  .mark.show{opacity:1}
  .mark .sym{font-size:150px;line-height:1;font-weight:bold}
  .mark.ok{background:rgba(43,182,115,.12)} .mark.ok .sym{color:var(--green)}
  .mark.ng{background:rgba(239,83,80,.10)} .mark.ng .sym{color:var(--red)}
  .mark .cor{font-size:26px;font-weight:bold;color:var(--red);background:#fff;border-radius:12px;padding:2px 14px}
  .shake{animation:sh .35s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:440px;width:100%;margin:0 auto}
  .pad button{font-size:34px;font-weight:bold;padding:14px 0;border-radius:18px;background:#fff;color:var(--ink);
    box-shadow:0 5px 0 var(--line)}
  .pad button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
  .pad .del{font-size:22px;color:var(--sub)}
  .pad .zero{grid-column:span 2}

  /* 結果 */
  .res{background:var(--card);border-radius:24px;box-shadow:0 4px 0 var(--line);padding:20px;text-align:center}
  .res .big{font-size:clamp(46px,12vw,72px);font-weight:bold;margin:4px 0}
  .res .big small{font-size:.45em;color:var(--sub)}
  .res .tm{font-size:22px;margin-bottom:6px}
  .res .msg{font-size:22px;font-weight:bold;margin:6px 0}
  .newrec{display:inline-block;background:var(--yellow);color:#6b4b00;font-weight:bold;border-radius:999px;
    padding:6px 18px;font-size:20px;animation:pop .6s}
  @keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .wrongs{margin-top:14px;text-align:left}
  .wrongs h3{margin:0 0 6px;font-size:17px;color:var(--red)}
  .wrongs ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
  .wrongs li{background:#fff1f0;border-radius:10px;padding:6px 10px;font-size:18px}
  .wrongs li s{color:var(--red)} .wrongs li b{color:var(--green)}
  .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
  .btns button{font-size:19px;font-weight:bold;padding:12px 20px;border-radius:16px;background:#fff;
    border:3px solid var(--line);color:var(--ink)}
  .btns .pri{background:var(--blue);border-color:var(--blue);color:#fff}
  .btns .rev{background:#fff1f0;border-color:var(--red);color:var(--red)}
  .note{font-size:13px;color:var(--sub);margin-top:8px}

  /* バッヂ */
  .badgebtn{display:block;margin:0 auto 14px;background:#fff6dc;border:3px solid var(--yellow);color:#8a6200;
    font-size:18px;font-weight:bold;border-radius:999px;padding:8px 22px}
  .bsec{margin:14px 0 6px;font-size:18px;font-weight:bold;color:var(--c,var(--ink))}
  .bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .bgrid.sp{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .bd{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 3px 0 var(--line)}
  .medal{width:70px;height:70px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:19px;color:#fff;background:var(--c);border:7px solid var(--ring);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.15);text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .medal.off{background:#ece6da;border-color:#ddd5c4;color:#bdb4a2;box-shadow:none;text-shadow:none}
  .bd .bn{font-size:14px;font-weight:bold}
  .bd .bc{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.35}
  .bd.off .bn{color:#b0a895}
  .gotb{margin-top:12px}
  .gotb .ttl{font-size:20px;font-weight:bold;color:#b07d00;margin-bottom:6px}
  .gotb .row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
  .gotb .bd{box-shadow:none;background:#fffaf0;animation:pop .6s;min-width:120px}
  .total{text-align:center;color:var(--sub);font-size:15px}
</style>
</head>
<body>

<!-- ===== ホーム ===== -->
<section id="home" class="screen active">
  <h1><span>たす</span><b>ひく</b>チャレンジ</h1>
  <p class="lead">レベルを えらんで スタート！</p>
  <button class="badgebtn" id="badgeBtn"></button>
  <div class="count-select" id="countSel">
    <button data-n="10" class="on">10もん</button>
    <button data-n="20">20もん</button>
  </div>
  <div class="levels" id="levels"></div>
  <div class="foot"><button id="resetBtn">きろくを けす（先生用）</button></div>
</section>

<!-- ===== プレイ ===== -->
<section id="play" class="screen">
  <div class="bar">
    <span class="tag" id="pTag"></span>
    <div class="prog"><i id="pBar"></i></div>
    <span class="num" id="pNum"></span>
    <span class="time" id="pTime">0.0</span>
    <button class="quit" id="quitBtn">やめる</button>
  </div>
  <div class="qbox" id="qbox">
    <div class="q" id="qText"></div>
    <div class="frame" id="frame"></div>
    <button class="hintbtn" id="hintBtn">ヒント</button>
    <div class="mark" id="mark"><div class="sym" id="markSym"></div><div class="cor" id="markCor"></div></div>
  </div>
  <div class="pad" id="pad">
    <button>7</button><button>8</button><button>9</button>
    <button>4</button><button>5</button><button>6</button>
    <button>1</button><button>2</button><button>3</button>
    <button class="zero">0</button><button class="del" data-k="del">けす</button>
  </div>
</section>

<!-- ===== バッヂ ===== -->
<section id="badges" class="screen">
  <h1>バッヂ</h1>
  <p class="total" id="bTotal"></p>
  <div id="bList"></div>
  <div class="btns"><button class="pri" id="bBack">もどる</button></div>
</section>

<!-- ===== 結果 ===== -->
<section id="result" class="screen">
  <h1 id="rTitle"></h1>
  <div class="res">
    <div id="rNew"></div>
    <div class="big" id="rScore"></div>
    <div class="tm" id="rTime"></div>
    <div class="msg" id="rMsg"></div>
    <div class="wrongs" id="rWrongs"></div>
    <div class="note" id="rNote"></div>
  </div>
  <div class="btns">
    <button class="rev" id="revBtn">まちがえた もんだいだけ もういちど</button>
    <button class="pri" id="againBtn">もういちど</button>
    <button id="homeBtn">レベルを えらぶ</button>
  </div>
</section>

<script>
/* ================= レベル定義 ================= */
const LEVELS = [
  {id:1, name:"5の ごうせい", ex:"れい：2と □で 5", color:"var(--l1)", type:"comp", total:5,
   pool(){ const a=[]; for(let x=1;x<=4;x++) a.push({a:x}); return a; }},
  {id:2, name:"10の ごうせい", ex:"れい：1と □で 10", color:"var(--l2)", type:"comp", total:10,
   pool(){ const a=[]; for(let x=1;x<=9;x++) a.push({a:x}); return a; }},
  {id:3, name:"くりあがりの ない たしざん", ex:"こたえが 10まで　れい：3＋4", color:"var(--l3)", type:"add",
   pool(){ const a=[]; for(let x=1;x<=9;x++) for(let y=1;x+y<=10;y++) a.push({a:x,b:y}); return a; }},
  {id:4, name:"くりさがりの ない ひきざん", ex:"10までの かず　れい：8－3", color:"var(--l4)", type:"sub",
   pool(){ const a=[]; for(let x=2;x<=10;x++) for(let y=1;y<x;y++) a.push({a:x,b:y}); return a; }},
  {id:5, name:"くりあがりの ある たしざん", ex:"れい：8＋5", color:"var(--l5)", type:"add",
   pool(){ const a=[]; for(let x=2;x<=9;x++) for(let y=2;y<=9;y++) if(x+y>=11) a.push({a:x,b:y}); return a; }},
  {id:6, name:"くりさがりの ある ひきざん", ex:"20までの かず　れい：13－7", color:"var(--l6)", type:"sub",
   pool(){ const a=[]; for(let x=11;x<=18;x++) for(let y=2;y<=9;y++) if(x%10<y && x-y<=9) a.push({a:x,b:y}); return a; }},
];
function answerOf(L,q){
  if(L.type==="comp") return L.total-q.a;
  if(L.type==="add")  return q.a+q.b;
  return q.a-q.b;
}
function textOf(L,q,ansHtml){
  if(L.type==="comp") return `${q.a}<span class="wd">と</span>${ansHtml}<span class="wd">で</span>${L.total}`;
  const op = L.type==="add" ? "＋" : "－";
  return `${q.a} ${op} ${q.b} = ${ansHtml}`;
}
function plainOf(L,q){
  if(L.type==="comp") return `${q.a}と □で ${L.total}`;
  return `${q.a} ${L.type==="add"?"＋":"－"} ${q.b}`;
}

/* ================= 記録（localStorage） ================= */
const KEY="tasuhiku-challenge-v1";
function loadRec(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function saveRec(r){ try{ localStorage.setItem(KEY,JSON.stringify(r)); }catch(e){} }
function better(n,o){ return !o || n.c>o.c || (n.c===o.c && n.t<o.t); }

/* ================= バッヂ ================= */
const BKEY="tasuhiku-badges-v1";
const RING={bronze:"#cd7f32",silver:"#b8c1cc",gold:"#f2c230"};
const SPEED={1:3,2:3,3:3,4:3,5:4,6:4};   // スピードバッヂ：1もんあたりの びょう数
function levelBadges(L){
  return [
    {id:`L${L.id}c`, label:`Lv${L.id}`, ring:RING.bronze, c:L.color, name:"チャレンジ",       desc:"さいごまで やりきる"},
    {id:`L${L.id}p`, label:`Lv${L.id}`, ring:RING.silver, c:L.color, name:"ぜんもん せいかい", desc:"ぜんもん せいかい"},
    {id:`L${L.id}s`, label:`Lv${L.id}`, ring:RING.gold,   c:L.color, name:"スピード",         desc:`ぜんもん せいかいで 1もん ${SPEED[L.id]}びょう いない`},
  ];
}
const SPECIAL=[
  {id:"x20",   label:"20",   ring:RING.gold, c:"#ef5350", name:"20もん パーフェクト", desc:"20もんで ぜんもん せいかい"},
  {id:"t100",  label:"100",  ring:RING.bronze, c:"#3d8bfd", name:"100もん せいかい",  desc:"せいかいが あわせて 100もん"},
  {id:"t500",  label:"500",  ring:RING.silver, c:"#3d8bfd", name:"500もん せいかい",  desc:"せいかいが あわせて 500もん"},
  {id:"t1000", label:"1000", ring:RING.gold,   c:"#3d8bfd", name:"1000もん せいかい", desc:"せいかいが あわせて 1000もん"},
  {id:"master",label:"★",    ring:RING.gold,   c:"#2bb673", name:"たすひく マスター", desc:"レベルの バッヂを ぜんぶ あつめる"},
];
const ALLB=[...LEVELS.flatMap(levelBadges),...SPECIAL];
function loadB(){ try{ return JSON.parse(localStorage.getItem(BKEY))||{got:{},total:0}; }catch(e){ return {got:{},total:0}; } }
function saveB(b){ try{ localStorage.setItem(BKEY,JSON.stringify(b)); }catch(e){} }
function medal(b,on){ return `<div class="medal ${on?'':'off'}" style="--c:${b.c};--ring:${b.ring}">${on?b.label:'？'}</div>`; }
function badgeCard(b,on){ return `<div class="bd ${on?'':'off'}">${medal(b,on)}<div class="bn">${b.name}</div><div class="bc">${b.desc}</div></div>`; }

// プレイ結果から あたらしい バッヂを はんてい
function checkBadges(L,n,correct,t){
  const B=loadB(), add=[];
  const give=id=>{ if(!B.got[id]){ B.got[id]=Date.now(); add.push(ALLB.find(x=>x.id===id)); } };
  B.total=(B.total||0)+correct;
  give(`L${L.id}c`);
  if(correct===n){
    give(`L${L.id}p`);
    if(t/n <= SPEED[L.id]*1000) give(`L${L.id}s`);
    if(n===20) give("x20");
  }
  if(B.total>=100) give("t100");
  if(B.total>=500) give("t500");
  if(B.total>=1000) give("t1000");
  if(LEVELS.flatMap(levelBadges).every(b=>B.got[b.id])) give("master");
  saveB(B);
  return add;
}
function renderBadges(){
  const B=loadB(); let h="";
  LEVELS.forEach(L=>{
    h+=`<div class="bsec" style="--c:${L.color}">レベル${L.id}　${L.name}</div><div class="bgrid">`+
       levelBadges(L).map(b=>badgeCard(b,!!B.got[b.id])).join("")+`</div>`;
  });
  h+=`<div class="bsec">とくべつ バッヂ</div><div class="bgrid sp">`+SPECIAL.map(b=>badgeCard(b,!!B.got[b.id])).join("")+`</div>`;
  $("bList").innerHTML=h;
  $("bTotal").textContent=`あつめた バッヂ ${Object.keys(B.got).length} / ${ALLB.length}　｜　せいかいした かず ${B.total||0}もん`;
}

/* ================= 効果音（オフラインで鳴る） ================= */
let actx=null;
function beep(ok){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [880,1320] : [300,220];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type = ok ? "sine" : "square"; o.frequency.value=f;
      const t=actx.currentTime+i*0.09;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(ok?0.25:0.08,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
}

/* ================= 画面 ================= */
const $=id=>document.getElementById(id);
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id)); window.scrollTo(0,0); }

let count=10;
$("countSel").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  count=+b.dataset.n;
  [...$("countSel").children].forEach(x=>x.classList.toggle("on",x===b));
  renderHome();
});

function fmt(t){ return (t/1000).toFixed(1); }
function renderHome(){
  const rec=loadRec();
  $("badgeBtn").textContent=`バッヂを みる（${Object.keys(loadB().got).length} / ${ALLB.length}）`;
  $("levels").innerHTML = LEVELS.map(L=>{
    const r=rec[`${L.id}-${count}`];
    const best = r ? `じこベスト：${r.c}/${count}もん　${fmt(r.t)}びょう ${r.c===count?'<span class="star">★</span>':''}`
                   : `じこベスト：まだ ないよ`;
    return `<button class="lv" style="--c:${L.color}" data-id="${L.id}">
      <div class="no">レベル ${L.id}</div><div class="nm">${L.name}</div>
      <div class="ex">${L.ex}</div><div class="best">${best}</div></button>`;
  }).join("");
}
$("levels").addEventListener("click",e=>{
  const b=e.target.closest(".lv"); if(!b) return;
  start(LEVELS.find(L=>L.id===+b.dataset.id), null);
});
$("resetBtn").addEventListener("click",()=>{
  if(confirm("この たんまつの きろくと バッヂを ぜんぶ けしますか？")){ try{localStorage.removeItem(KEY);localStorage.removeItem(BKEY);}catch(e){} renderHome(); }
});

/* ================= ゲーム ================= */
let G=null, timerId=null;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function makeQuestions(L,n){
  const pool=L.pool(); let out=[];
  while(out.length<n){
    let s=shuffle(pool.slice());
    // 同じ問題が続かないように
    if(out.length && s.length>1 && JSON.stringify(s[0])===JSON.stringify(out[out.length-1])) s.push(s.shift());
    out=out.concat(s);
  }
  return out.slice(0,n);
}

function start(L, reviewList){
  const qs = reviewList ? shuffle(reviewList.slice()) : makeQuestions(L,count);
  G={L, qs, i:0, input:"", wrong:[], correct:0, hints:0, review:!!reviewList, lock:false, t0:performance.now()};
  $("pTag").textContent = `レベル${L.id}` + (G.review?"（ふくしゅう）":"");
  document.querySelector("#play").style.setProperty("--c",L.color);
  $("pTag").style.background=L.color; $("pBar").style.background=L.color;
  $("hintBtn").style.display = L.type==="comp" ? "" : "none";
  show("play"); drawQ();
  clearInterval(timerId);
  timerId=setInterval(()=>{ $("pTime").textContent=fmt(performance.now()-G.t0); },100);
}

function drawQ(){
  const q=G.qs[G.i];
  const a = G.input==="" ? `<span class="ans empty">0</span>` : `<span class="ans">${G.input}</span>`;
  $("qText").innerHTML=textOf(G.L,q,a);
  $("pNum").textContent=`${G.i+1}/${G.qs.length}`;
  $("pBar").style.width=(G.i/G.qs.length*100)+"%";
}
function drawFrame(){
  const L=G.L, q=G.qs[G.i]; let h="";
  const rows = L.total===10 ? [0,5] : [0];
  rows.forEach(s=>{ h+='<div class="row">'; for(let k=s;k<s+5;k++) h+=`<span class="dot ${k<q.a?'f':''}"></span>`; h+='</div>'; });
  $("frame").innerHTML=h;
}

function press(k){
  if(!G || G.lock) return;
  if(k==="del"){ G.input=G.input.slice(0,-1); drawQ(); return; }
  if(G.input.length>=2) return;
  G.input += k;
  drawQ();
  // こたえの けた数まで おしたら（または ちがう数字を おしたら）すぐ はんてい
  const ans=String(answerOf(G.L,G.qs[G.i]));
  if(G.input.length>=ans.length || !ans.startsWith(G.input)) judge();
}

function judge(){
  G.lock=true;
  const q=G.qs[G.i], ans=answerOf(G.L,q), v=+G.input;
  const ok = v===ans;
  const m=$("mark");
  m.className="mark show "+(ok?"ok":"ng");
  $("markSym").textContent= ok ? "○" : "×";
  $("markCor").textContent= ok ? "" : `こたえは ${ans}`;
  $("markCor").style.display= ok ? "none" : "";
  beep(ok);
  if(ok) G.correct++;
  else { G.wrong.push({q, mine:v}); $("qbox").classList.remove("shake"); void $("qbox").offsetWidth; $("qbox").classList.add("shake"); }
  setTimeout(()=>{
    m.className="mark"; $("frame").innerHTML="";
    G.i++; G.input=""; G.lock=false;
    if(G.i>=G.qs.length) finish(); else drawQ();
  }, ok?450:1400);
}

function finish(){
  clearInterval(timerId);
  const t=performance.now()-G.t0, n=G.qs.length, L=G.L;
  $("pBar").style.width="100%";
  $("rTitle").innerHTML=`レベル${L.id}　${L.name}`;
  $("rScore").innerHTML=`${G.correct}<small> / ${n}もん</small>`;
  $("rTime").textContent=`タイム　${fmt(t)}びょう`;
  const rate=G.correct/n;
  $("rMsg").textContent = rate===1 ? "ぜんもん せいかい！すごい！" : rate>=0.8 ? "よく できました！" : rate>=0.5 ? "その ちょうし！" : "もう いちど やってみよう！";

  // 記録（ふくしゅうモードは記録しない）
  $("rNew").innerHTML="";
  if(!G.review){
    const rec=loadRec(), key=`${L.id}-${n}`, now={c:G.correct,t:Math.round(t)};
    if(better(now,rec[key])){
      const first=!rec[key]; rec[key]=now; saveRec(rec);
      if(!first) $("rNew").innerHTML='<span class="newrec">★ じこベスト こうしん！ ★</span>';
    }
    const nb=checkBadges(L,n,G.correct,t);
    if(nb.length) $("rNew").innerHTML+=`<div class="gotb"><div class="ttl">あたらしい バッヂを ゲット！</div><div class="row">`+
      nb.map(b=>badgeCard(b,true)).join("")+`</div></div>`;
  }
  $("rNote").textContent = (G.review ? "ふくしゅうモードの けっかは きろくされません。" : "") +
                           (G.hints ? `　ヒントを ${G.hints}かい つかったよ。` : "");

  if(G.wrong.length){
    $("rWrongs").innerHTML = `<h3>まちがえた もんだい</h3><ul>` + G.wrong.map(w=>
      `<li>${plainOf(L,w.q)} → <s>${w.mine}</s>　<b>${answerOf(L,w.q)}</b></li>`).join("") + `</ul>`;
    $("revBtn").style.display="";
  } else { $("rWrongs").innerHTML=""; $("revBtn").style.display="none"; }
  show("result");
}

/* ================= 操作 ================= */
$("pad").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  press(b.dataset.k || b.textContent);
});
document.addEventListener("keydown",e=>{
  if(!$("play").classList.contains("active")) return;
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==="Backspace"){ e.preventDefault(); press("del"); }
});
$("hintBtn").addEventListener("click",()=>{ if(!G||G.lock||$("frame").innerHTML) return; G.hints++; drawFrame(); });
$("quitBtn").addEventListener("click",()=>{
  if(confirm("とちゅうで やめますか？（きろくは のこりません）")){ clearInterval(timerId); G=null; renderHome(); show("home"); }
});
$("againBtn").addEventListener("click",()=>start(G.L,null));
$("revBtn").addEventListener("click",()=>start(G.L,G.wrong.map(w=>w.q)));
$("badgeBtn").addEventListener("click",()=>{ renderBadges(); show("badges"); });
$("bBack").addEventListener("click",()=>{ renderHome(); show("home"); });
$("homeBtn").addEventListener("click",()=>{ renderHome(); show("home"); });

renderHome();
</script>
</body>
</html>
